<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Delta：仓库</title>
<style>
:root{--bg:#071018;--panel:#0d1d29;--line:#35627c;--text:#edf7ff;--muted:#9eb9c8;--blue:#79d8ff;--green:#7cf2b1;--gold:#ffd568;--red:#ff7979}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;background:radial-gradient(circle at top,#20495b,#071018 52%,#03070b);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif}.app{width:min(1100px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.top h1{margin:0;color:var(--green);letter-spacing:2px;font-size:clamp(27px,5vw,46px)}.top p{margin:6px 0;color:var(--muted)}a{color:var(--blue);border:1px solid #79d8ff66;border-radius:9px;padding:9px 12px;text-decoration:none}.nav{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{padding:12px;text-align:center;border:1px solid #ffffff18;border-radius:10px;background:#ffffff09}.stat small{display:block;color:var(--muted)}.stat b{display:block;color:var(--gold);font-size:21px;margin-top:5px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:15px}.panel{padding:16px;border:1px solid var(--line);border-radius:15px;background:rgba(13,29,41,.92)}h2{margin:0 0 12px;color:var(--blue);font-size:20px}.notice{line-height:1.7;color:#d7ebf5;margin-bottom:15px;padding:13px;border:1px solid #79d8ff55;border-radius:11px;background:#102d3aaa}.items{display:grid;gap:8px;max-height:430px;overflow:auto}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px;border:1px solid #ffffff16;border-radius:9px;background:#ffffff08}.item b{display:block}.item small{display:block;color:var(--muted);margin-top:4px}.item button,.actions button{border:0;border-radius:8px;padding:8px 10px;background:linear-gradient(#a8eaff,#51bfff);font-weight:bold;cursor:pointer;color:#061018}.empty{padding:25px;text-align:center;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{padding:11px 14px}.danger{background:linear-gradient(#ffaaa5,#ff6868)!important;color:#250708!important}.message{min-height:27px;margin-top:12px;text-align:center;color:var(--gold)}.good{color:var(--green)}.bad{color:var(--red)}@media(max-width:650px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><main class="app">
<header class="top"><div><h1>PROJECT DELTA：仓库</h1><p>安全仓库 · 背包管理 · 永久保存的物资</p></div><nav class="nav"><a href="index.html">开始新游戏</a><a href="project-delta-armory.html">武器台</a><a href="project-delta-rng.html">RNG 市场</a></nav></header>
<div class="notice">安全仓库里的物品不会因为死亡而丢失。行动中的物品先放入背包，成功撤离后才会转入安全仓库；死亡只会清空当前背包。</div>
<section class="stats"><div class="stat"><small>安全仓库物品</small><b id="safeCount">0</b></div><div class="stat"><small>安全仓库价值</small><b id="safeValue">0</b></div><div class="stat"><small>当前背包</small><b id="bagCount">0</b></div><div class="stat"><small>背包价值</small><b id="bagValue">0</b></div></section>
<div class="layout"><section class="panel"><h2>安全仓库</h2><div class="items" id="safeItems"></div></section><section class="panel"><h2>当前行动背包</h2><div class="items" id="bagItems"></div><div class="actions"><button id="extract">成功撤离并存入仓库</button><button class="danger" id="die">死亡并丢失背包</button></div><div class="message" id="message">从新游戏开始后，行动物资会显示在这里。</div></section></div>
<section class="panel"><h2>测试操作</h2><div class="actions"><button data-loot="AK-12|武器|4200">拾取 AK-12</button><button data-loot="黑色 Key Card|钥匙卡|12000">拾取黑色 Key Card</button><button data-loot="加密硬盘|情报物资|7500">拾取加密硬盘</button><button data-loot="黄金撤离凭证|特殊物资|20000">拾取黄金撤离凭证</button></div><p style="color:var(--muted);font-size:12px;line-height:1.6">这些拾取按钮用于测试仓库规则。正式射击、地图和副本页面可以使用相同的背包数据规则。</p></section>
</main>
<script>
const $=id=>document.getElementById(id);let safe=JSON.parse(localStorage.getItem('projectDeltaSafe')||'[]');let bag=JSON.parse(sessionStorage.getItem('projectDeltaBag')||'[]');let active=sessionStorage.getItem('projectDeltaRun')==='active';
function save(){localStorage.setItem('projectDeltaSafe',JSON.stringify(safe));sessionStorage.setItem('projectDeltaBag',JSON.stringify(bag));sessionStorage.setItem('projectDeltaRun',active?'active':'inactive')}
function total(list){return list.reduce((sum,item)=>sum+item.value,0)}
function renderList(id,list,place){$(id).innerHTML=list.length?list.map((item,i)=>`<div class="item"><div><b>${item.name}</b><small>${item.type} · $${item.value.toLocaleString()}</small></div><button data-remove="${place}:${i}">取出</button></div>`).join(''):`<div class="empty">暂无物品</div>`;document.querySelectorAll('[data-remove]').forEach(btn=>btn.onclick=()=>{const [where,index]=btn.dataset.remove.split(':');if(where==='safe'){bag.push(safe.splice(+index,1)[0]);active=true}else{safe.push(bag.splice(+index,1)[0])}save();render()})}
function render(){renderList('safeItems',safe,'safe');renderList('bagItems',bag,'bag');$('safeCount').textContent=safe.length;$('safeValue').textContent='$'+total(safe).toLocaleString();$('bagCount').textContent=bag.length;$('bagValue').textContent='$'+total(bag).toLocaleString()}
function message(text,kind=''){ $('message').textContent=text;$('message').className='message '+kind }
function addLoot(raw){if(!active){active=true;message('已自动开始一场新行动。')}const [name,type,value]=raw.split('|');bag.push({name,type,value:Number(value)});save();render();message(name+' 已放入行动背包。')}
$('extract').onclick=()=>{if(!bag.length){message('背包为空，无法撤离。','bad');return}safe.push(...bag);bag=[];active=false;save();render();message('成功撤离！所有背包物资已进入安全仓库。','good')}
$('die').onclick=()=>{if(!active){message('当前没有进行中的行动。','bad');return}const lost=bag.length;bag=[];active=false;save();render();message('行动失败，丢失 '+lost+' 件背包物资；安全仓库没有损失。','bad')}
document.querySelectorAll('[data-loot]').forEach(btn=>btn.onclick=()=>addLoot(btn.dataset.loot));render();
</script></body></html>
