<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Delta：黑市</title>
<style>
:root{--bg:#080b12;--panel:#15131b;--line:#55406d;--text:#f1eaff;--muted:#b2a5bd;--gold:#ffd568;--red:#ff7979;--purple:#d09cff;--green:#7cf2b1}*{box-sizing:border-box}body{margin:0;padding:18px;background:radial-gradient(circle at top,#40264c,#0b0911 48%,#030406);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif}.app{width:min(1120px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.top h1{margin:0;color:var(--gold);letter-spacing:3px;font-size:clamp(27px,5vw,46px)}.top p{margin:6px 0;color:var(--muted)}a{color:var(--purple);border:1px solid #d09cff66;border-radius:9px;padding:9px 12px;text-decoration:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{padding:12px;text-align:center;border:1px solid #ffffff18;border-radius:10px;background:#ffffff09}.stat small{display:block;color:var(--muted)}.stat b{display:block;margin-top:5px;color:var(--gold);font-size:22px}.notice{padding:14px;border:1px solid #d09cff55;border-radius:12px;background:#271936aa;color:#eadff2;line-height:1.6;margin-bottom:15px}.layout{display:grid;grid-template-columns:1fr .7fr;gap:15px}.panel{background:rgba(21,19,27,.92);border:1px solid var(--line);border-radius:15px;padding:16px}.panel h2{margin:0 0 12px;color:var(--purple);font-size:20px}.market{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.offer{padding:13px;border:1px solid #ffffff1d;border-radius:11px;background:linear-gradient(145deg,#251b31,#15131d)}.offer h3{margin:0;color:var(--gold);font-size:15px}.offer p{color:var(--muted);font-size:12px;line-height:1.5;min-height:52px}.offer strong{display:block;color:var(--green);margin:9px 0}.offer button,.sell{border:0;border-radius:8px;padding:8px 11px;cursor:pointer;background:linear-gradient(#ffeaa0,#d7a930);font-weight:bold;color:#181006}.offer button:disabled{opacity:.4;cursor:not-allowed}.inventory{display:grid;gap:8px;max-height:470px;overflow:auto}.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;border-radius:9px;background:#ffffff08;border:1px solid #ffffff15;font-size:12px}.item small{display:block;color:var(--muted);margin-top:3px}.sell{padding:6px 9px;background:#ffffff14;color:var(--text);border:1px solid #ffffff25}.empty{text-align:center;color:var(--muted);padding:25px}.legendary{color:var(--gold)}.epic{color:var(--purple)}.rare{color:#78d8ff}.uncommon{color:var(--green)}@media(max-width:800px){.layout{grid-template-columns:1fr}.market{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.stats{grid-template-columns:repeat(2,1fr)}.market{grid-template-columns:1fr}}
</style>
</head>
<body><main class="app"><header class="top"><div><h1>BLACK MARKET</h1><p>PROJECT DELTA · 非法交易站</p></div><div><a href="project-delta-rng.html">RNG 市场</a> <a href="keychain.html">Keychain</a></div></header>
<section class="stats"><div class="stat"><small>现金</small><b id="cash">50000</b></div><div class="stat"><small>黑市代币</small><b id="tokens">8</b></div><div class="stat"><small>库存</small><b id="count">0</b></div><div class="stat"><small>库存价值</small><b id="value">0</b></div></section>
<div class="notice">欢迎来到黑市。这里出售稀有武器、特殊 Key Card、传奇配件和加密物资。黑市商品价格较高，但不会受到普通商店库存限制。</div>
<div class="layout"><section class="panel"><h2>今日黑市货物</h2><div class="market" id="market"></div></section><section class="panel"><h2>黑市库存</h2><div class="inventory" id="inventory"><div class="empty">还没有黑市物品。</div></div></section></div>
<script>
const offers=[
 ['黑色 Key Card','特殊钥匙卡','key',12000,'legendary'],['金色 Key Card','指挥中心钥匙','key',18000,'legendary'],['彩虹 Key Card','核心区钥匙','key',35000,'legendary'],
 ['AWM 黑市版','高威力狙击枪','gun',26000,'epic'],['HK416 改装版','精英突击步枪','gun',22000,'epic'],['量子瞄准镜','特殊热成像配件','accessory',14500,'legendary'],
 ['���级装甲板','重型防护装备','armor',9000,'rare'],['加密硬盘','高价值情报物品','loot',7500,'rare'],['黄金撤离凭证','特殊副本奖励凭证','loot',20000,'legendary'],
 ['黑市代币包','获得 3 枚黑市代币','token',0,'rare'],['密码破解器','开启机密房间','accessory',11000,'epic'],['黑匣子','未知高级情报','loot',13000,'epic']
];
let cash=50000,tokens=8,inventory=[];const $=id=>document.getElementById(id);
function refresh(){ $('cash').textContent=cash.toLocaleString();$('tokens').textContent=tokens;$('count').textContent=inventory.length;$('value').textContent=inventory.reduce((a,x)=>a+x.price,0).toLocaleString() }
function renderMarket(){$('market').innerHTML=offers.map((x,i)=>`<article class="offer"><h3 class="${x[4]}">${x[0]}</h3><p>${x[1]}<br>${x[3]?'现金价格：$'+x[3].toLocaleString():'价格：2 黑市代币'}</p><strong>${x[4].toUpperCase()}</strong><button data-buy="${i}" ${x[3]&&cash<x[3]?'disabled':''}>购买</button></article>`).join('');document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buy(+b.dataset.buy))}
function renderInventory(){if(!inventory.length){$('inventory').innerHTML='<div class="empty">还没有黑市物品。</div>';return}$('inventory').innerHTML=inventory.map((x,i)=>`<div class="item"><div><b class="${x.rarity}">${x.name}</b><small>${x.type} · 价值 $${x.price.toLocaleString()}</small></div><button class="sell" data-sell="${i}">出售</button></div>`).join('');document.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>{let i=+b.dataset.sell;cash+=inventory[i].price;inventory.splice(i,1);refresh();renderInventory()})}
function buy(i){let x=offers[i];if(x[5])return;if(x[3]){if(cash<x[3])return;cash-=x[3]}else{if(tokens<2)return;tokens-=2}if(x[2]==='token')tokens+=3;else inventory.push({name:x[0],type:x[2],price:Math.floor((x[3]||5000)*.65),rarity:x[4]});refresh();renderInventory();}
renderMarket();renderInventory();refresh();
</script></main></body></html>
