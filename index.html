<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delta Force：战场掠夺</title>
  <style>
    :root {
      --bg0: #071018;
      --bg1: #0d1824;
      --bg2: #101f2b;
      --panel: rgba(10, 18, 25, 0.72);
      --border: rgba(118, 181, 255, 0.38);
      --white: #edf6ff;
      --blue: #7dcaff;
      --green: #78f0b1;
      --gold: #ffd76c;
      --red: #ff7d6d;
      --orange: #ffb25d;
      --purple: #b9b8ff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: linear-gradient(180deg, var(--bg0), var(--bg1) 38%, var(--bg2));
      color: var(--white);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    #gameWrap {
      position: relative;
      width: min(96vw, 1180px);
      height: min(88vh, 760px);
      border-radius: 18px;
      overflow: hidden;
      border: 2px solid var(--border);
      background: radial-gradient(circle at top, rgba(67, 113, 151, 0.22), transparent 32%),
                  linear-gradient(180deg, #0a1218, #101a25);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(255,255,255,0.04);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #081118;
      cursor: crosshair;
    }

    .hud {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      pointer-events: none;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .brand {
      padding: 9px 14px;
      border-radius: 10px;
      border: 1px solid rgba(125, 202, 255, 0.32);
      background: rgba(11, 19, 29, 0.45);
      color: var(--blue);
      font-weight: 700;
      letter-spacing: 1px;
      font-size: 14px;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
    }

    .stat {
      min-width: 92px;
      text-align: center;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid rgba(125, 202, 255, 0.18);
      background: rgba(11, 19, 29, 0.45);
      font-size: 13px;
      color: var(--white);
    }

    .stat strong {
      color: var(--gold);
    }

    .missionInfo {
      position: absolute;
      left: 20px;
      bottom: 18px;
      z-index: 18;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(8, 18, 26, 0.7);
      border: 1px solid rgba(121, 216, 255, 0.25);
      color: var(--white);
      font-size: 12px;
      line-height: 1.5;
      pointer-events: none;
      box-shadow: 0 8px 18px rgba(0,0,0,0.2);
    }

    .missionStatus {
      position: absolute;
      right: 18px;
      bottom: 18px;
      z-index: 25;
      padding: 9px 12px;
      border-radius: 10px;
      background: rgba(6, 15, 22, 0.8);
      border: 1px solid rgba(121, 216, 255, 0.28);
      color: var(--white);
      font-size: 12px;
      pointer-events: none;
      box-shadow: 0 8px 16px rgba(0,0,0,0.22);
    }

    .panel {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(5, 10, 15, 0.58);
      backdrop-filter: blur(4px);
      transition: opacity 0.25s ease;
    }

    .panel.hidden { opacity: 0; pointer-events: none; }

    .panel-box {
      width: min(76%, 520px);
      padding: 26px 22px 20px;
      border-radius: 20px;
      background: rgba(10, 18, 25, 0.82);
      border: 1px solid rgba(125, 202, 255, 0.42);
      box-shadow: 0 24px 55px rgba(0,0,0,0.5);
      text-align: center;
    }

    .title {
      margin: 0 0 12px;
      font-size: clamp(28px, 4vw, 48px);
      letter-spacing: 2px;
      color: var(--green);
      text-shadow: 0 0 18px rgba(120, 240, 177, 0.25);
    }

    .subtitle {
      margin: 0 0 18px;
      color: rgba(237, 246, 255, 0.86);
      line-height: 1.8;
      font-size: 14px;
    }

    .buttonRow {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    button {
      border: none;
      padding: 12px 22px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      color: #04131b;
      background: linear-gradient(180deg, #9fe0ff, #54b7ff);
      box-shadow: 0 12px 22px rgba(84, 183, 255, 0.38);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    button.secondary {
      background: linear-gradient(180deg, #f3d790, #d09e32);
      box-shadow: 0 12px 22px rgba(208, 158, 50, 0.3);
    }

    button.warning {
      background: linear-gradient(180deg, #ffb0a3, #ff6565);
      box-shadow: 0 12px 22px rgba(255, 101, 101, 0.3);
      color: #250708;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 26px rgba(84, 183, 255, 0.44);
    }

    button:active { transform: translateY(0); }

    .hint {
      margin-top: 16px;
      font-size: 12px;
      letter-spacing: 1px;
      color: rgba(237,246,255,0.7);
    }

    .miniLinks {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .miniLinks a {
      display: inline-block;
      text-decoration: none;
      color: var(--blue);
      background: rgba(11, 19, 29, 0.5);
      border: 1px solid rgba(125, 202, 255, 0.28);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="gameWrap">
    <div class="hud">
      <div class="brand">Delta Force：战场掠夺</div>
      <div class="stats">
        <div class="stat">HP <strong id="hp">100</strong></div>
        <div class="stat">装甲 <strong id="armor">0</strong></div>
        <div class="stat">弹药 <strong id="ammo">30</strong></div>
        <div class="stat">分数 <strong id="score">0</strong></div>
        <div class="stat">时间 <strong id="time">0s</strong></div>
      </div>
    </div>

    <div id="missionInfo" class="missionInfo">目标：收集 0 / 3 个物资 · 前往撤离区</div>
    <div id="missionStatus" class="missionStatus">背包: 0 · 仓库: 0</div>

    <canvas id="gameCanvas" width="1180" height="760"></canvas>

    <div id="startPanel" class="panel">
      <div class="panel-box">
        <h1 class="title">战场掠夺</h1>
        <p class="subtitle">
          WASD 移动 · 鼠标瞄准 · 左键射击 · 空格冲刺<br>
          探索战场，搜集物资，最后到达撤离区完成任务。
        </p>
        <div class="buttonRow">
          <button id="startBtn">开始任务</button>
          <button id="extractBtn" class="secondary">撤离</button>
        </div>
        <div class="miniLinks">
          <a href="warehouse.html">安全仓库</a>
          <a href="project-delta-rng.html">RNG 市场</a>
          <a href="project-delta-armory.html">武器台</a>
          <a href="map-exploration.html">地图</a>
        </div>
        <div class="hint">提示：不是纯打怪模式。你可以在地图中移动、收集物资并撤离。死亡会清空背包，但不会清空安全仓库。</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const startPanel = document.getElementById("startPanel");
    const startBtn = document.getElementById("startBtn");
    const extractBtn = document.getElementById("extractBtn");
    const missionInfoEl = document.getElementById("missionInfo");
    const missionStatusEl = document.getElementById("missionStatus");

    const hpEl = document.getElementById("hp");
    const armorEl = document.getElementById("armor");
    const ammoEl = document.getElementById("ammo");
    const scoreEl = document.getElementById("score");
    const timeEl = document.getElementById("time");

    const safeKey = 'projectDeltaSafe';
    const bagKey = 'projectDeltaBag';
    const runKey = 'projectDeltaRun';

    let safeStorage = JSON.parse(localStorage.getItem(safeKey) || '[]');
    let missionBag = JSON.parse(sessionStorage.getItem(bagKey) || '[]');

    const keys = {};
    const mouse = { x: canvas.width / 2, y: canvas.height / 2, down: false };

    const world = { w: 1800, h: 1200 };
    const camera = { x: 0, y: 0 };

    const config = {
      playerBaseSpeed: 3.6,
      playerDashBoost: 1.85,
      shootInterval: 0.12,
      maxAmmo: 30,
      maxReserveAmmo: 240,
      bulletSpeed: 10.5,
      maxWeaponLevel: 4,
      startingHealth: 100,
      startingArmor: 0,
      objectiveTarget: 3
    };

    let gameState = "menu";
    let loopId = null;
    let elapsed = 0;
    let startTimestamp = 0;
    let score = 0;
    let lastTs = 0;
    let collected = 0;
    let missionCleared = false;

    let bullets = [];
    let enemies = [];
    let loot = [];
    let particles = [];
    let muzzleFlashes = [];
    let supplyPoints = [];
    let extractionZone = { x: 1640, y: 1060, r: 74 };

    const player = {
      x: 180,
      y: 220,
      r: 18,
      speed: config.playerBaseSpeed,
      angle: 0,
      hp: config.startingHealth,
      maxHp: config.startingHealth,
      armor: config.startingArmor,
      ammo: config.maxAmmo,
      reserveAmmo: 120,
      fireCooldown: 0,
      dashCooldown: 0,
      dashTimer: 0,
      weaponLevel: 1
    };

    function clamp(v, min, max) {
      return Math.min(Math.max(v, min), max);
    }

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function saveBag() {
      sessionStorage.setItem(bagKey, JSON.stringify(missionBag));
      updateMissionStatus();
    }

    function saveSafe() {
      localStorage.setItem(safeKey, JSON.stringify(safeStorage));
      updateMissionStatus();
    }

    function updateMissionStatus() {
      missionStatusEl.textContent = `背包: ${missionBag.length} · 仓库: ${safeStorage.length}`;
    }

    function getAreaName() {
      const x = player.x;
      const y = player.y;
      if (x < 420 && y < 420) return '前线哨站';
      if (x < 920 && y < 760) return '补给线';
      if (x > 1200 && y > 780) return '撤离区';
      if (x > 1100) return '北部高地';
      if (y > 700) return '南部通道';
      return '战区中心';
    }

    function updateMissionInfo() {
      const objective = collected >= config.objectiveTarget ? '已收集完毕，前往撤离区' : `收集 ${collected} / ${config.objectiveTarget} 个物资`;
      missionInfoEl.textContent = `目标：${objective} · 区域：${getAreaName()}`;
    }

    function addMissionLoot(name, type, value) {
      missionBag.push({ name, type, value });
      saveBag();
    }

    function clearMissionBag() {
      missionBag = [];
      saveBag();
    }

    function moveBagToSafe() {
      if (!missionBag.length) return;
      safeStorage.push(...missionBag);
      missionBag = [];
      saveBag();
      saveSafe();
    }

    function spawnSupplyPoints() {
      supplyPoints = [
        { x: 360, y: 300, value: 1, color: '#7efeb0' },
        { x: 720, y: 540, value: 1, color: '#ffd866' },
        { x: 980, y: 280, value: 1, color: '#7ec1ff' },
        { x: 1350, y: 620, value: 1, color: '#d7d6ff' },
        { x: 620, y: 920, value: 1, color: '#ffa866' }
      ];
    }

    function resetGame() {
      player.x = 180;
      player.y = 220;
      player.r = 18;
      player.speed = config.playerBaseSpeed;
      player.angle = 0;
      player.hp = config.startingHealth;
      player.maxHp = config.startingHealth;
      player.armor = config.startingArmor;
      player.ammo = config.maxAmmo;
      player.reserveAmmo = 120;
      player.fireCooldown = 0;
      player.dashCooldown = 0;
      player.dashTimer = 0;
      player.weaponLevel = 1;

      bullets = [];
      enemies = [];
      loot = [];
      particles = [];
      muzzleFlashes = [];
      spawnSupplyPoints();
      collected = 0;
      missionCleared = false;
      elapsed = 0;
      score = 0;
      startTimestamp = performance.now();
      clearMissionBag();
      sessionStorage.setItem(runKey, 'active');
      updateHud();
      updateMissionStatus();
      updateMissionInfo();
    }

    function updateHud() {
      hpEl.textContent = Math.max(0, Math.ceil(player.hp));
      armorEl.textContent = Math.max(0, Math.ceil(player.armor));
      ammoEl.textContent = `${player.ammo}/${player.reserveAmmo}`;
      scoreEl.textContent = Math.floor(score);
      timeEl.textContent = `${Math.floor(elapsed / 1000)}s`;
    }

    function startGame() {
      resetGame();
      gameState = "playing";
      startPanel.classList.add("hidden");
      if (loopId) cancelAnimationFrame(loopId);
      loopId = requestAnimationFrame(gameLoop);
    }

    function showGameOver() {
      gameState = "menu";
      startPanel.classList.remove("hidden");
      clearMissionBag();
      sessionStorage.setItem(runKey, 'inactive');
      const box = startPanel.querySelector(".panel-box");
      box.innerHTML = `
        <h1 class="title" style="color: var(--red);">任务失败</h1>
        <p class="subtitle">
          本次分数：<strong style="color: var(--gold);">${Math.floor(score)}</strong><br>
          生存时间：<strong style="color: var(--blue);">${Math.floor(elapsed / 1000)}s</strong><br>
          物资搜刮了不少，但还差一步。<br>
          背包已清空，但安全仓库不会丢失。
        </p>
        <div class="buttonRow">
          <button id="retryBtn">再来一局</button>
          <button id="retrySafeBtn" class="secondary">查看仓库</button>
        </div>
        <div class="miniLinks">
          <a href="warehouse.html">安全仓库</a>
          <a href="project-delta-rng.html">RNG 市场</a>
          <a href="project-delta-armory.html">武器台</a>
        </div>
        <div class="hint">继续冲锋，战场不会放过你。</div>
      `;

      document.getElementById("retryBtn").addEventListener("click", () => {
        startPanel.classList.add("hidden");
        startGame();
      });

      document.getElementById("retrySafeBtn").addEventListener("click", () => {
        window.location.href = "warehouse.html";
      });
    }

    function spawnParticles(x, y, count, color, speedMul = 1) {
      for (let i = 0; i < count; i++) {
        const a = rand(0, Math.PI * 2);
        const speed = rand(0.6, 4.2) * speedMul;
        particles.push({
          x, y,
          vx: Math.cos(a) * speed,
          vy: Math.sin(a) * speed,
          life: rand(20, 60),
          color
        });
      }
    }

    function spawnMuzzleFlash(x, y, angle) {
      muzzleFlashes.push({
        x, y,
        angle,
        life: 0.08,
        len: 18 + Math.random() * 7
      });
    }

    function randomNearPlayerRadius(radius = 720) {
      const angle = Math.random() * Math.PI * 2;
      const distVal = rand(110, radius);
      const x = clamp(player.x + Math.cos(angle) * distVal, 40, world.w - 40);
      const y = clamp(player.y + Math.sin(angle) * distVal, 40, world.h - 40);
      return { x, y };
    }

    function spawnEnemy() {
      const pos = randomNearPlayerRadius(700);
      const level = Math.min(6, 1 + Math.floor(elapsed / 18000));
      const baseR = rand(14, 24);
      enemies.push({
        x: pos.x,
        y: pos.y,
        r: baseR,
        hp: 1 + level,
        speed: 0.7 + level * 0.18 + rand(0, 0.7),
        color: ["#ff8f75", "#ff5a5f", "#ff9f49", "#f96fb2"][Math.floor(Math.random() * 4)],
        damage: 1 + level * 0.2
      });
    }

    function spawnLoot(x, y, type = null) {
      const pool = ["medkit", "ammo", "armor", "gun"];
      const itemType = type || pool[Math.floor(Math.random() * pool.length)];
      loot.push({ x, y, r: 11, type: itemType, pulse: rand(0, 1000) });
    }

    function addLootFromPickup(type) {
      const map = {
        medkit: { name: '医疗包', type: '补给', value: 1200 },
        ammo: { name: '弹药箱', type: '补给', value: 900 },
        armor: { name: '装甲板', type: '防具', value: 1800 },
        gun: { name: '升级武器模块', type: '武器', value: 2800 }
      };
      const item = map[type] || { name: '随机物资', type: '补给', value: 1000 };
      addMissionLoot(item.name, item.type, item.value);
    }

    function shoot() {
      if (gameState !== "playing") return;
      if (player.fireCooldown > 0) return;
      if (player.ammo <= 0) {
        if (player.reserveAmmo > 0) {
          const reloadAmount = Math.min(30, player.reserveAmmo);
          player.ammo = reloadAmount;
          player.reserveAmmo -= reloadAmount;
        } else {
          return;
        }
      }

      player.ammo -= 1;
      player.fireCooldown = config.shootInterval;

      const shotCount = player.weaponLevel >= 3 ? 3 : 1;
      const spread = player.weaponLevel >= 3 ? 0.22 : 0.06;

      for (let i = 0; i < shotCount; i++) {
        const angle = player.angle + (shotCount === 1 ? 0 : (i - (shotCount - 1) / 2) * spread);
        const muzzleX = player.x + Math.cos(angle) * (player.r + 20);
        const muzzleY = player.y + Math.sin(angle) * (player.r + 20);

        bullets.push({
          x: muzzleX,
          y: muzzleY,
          vx: Math.cos(angle) * config.bulletSpeed,
          vy: Math.sin(angle) * config.bulletSpeed,
          r: 4,
          life: 52,
          color: "#dff7ff"
        });

        spawnMuzzleFlash(muzzleX, muzzleY, angle);
      }

      spawnParticles(player.x + Math.cos(player.angle) * 20, player.y + Math.sin(player.angle) * 20, 6, '#b7ebff', 1.1);
    }

    function dash() {
      if (gameState !== "playing") return;
      if (player.dashCooldown > 0) return;
      player.dashCooldown = 1.8;
      player.dashTimer = 0.18;
    }

    function handleInput() {
      const dx = mouse.x - (canvas.width / 2);
      const dy = mouse.y - (canvas.height / 2);
      player.angle = Math.atan2(dy, dx);

      let moveX = 0;
      let moveY = 0;
      if (keys['w'] || keys['W']) moveY -= 1;
      if (keys['s'] || keys['S']) moveY += 1;
      if (keys['a'] || keys['A']) moveX -= 1;
      if (keys['d'] || keys['D']) moveX += 1;

      if (moveX || moveY) {
        const len = Math.hypot(moveX, moveY) || 1;
        moveX /= len;
        moveY /= len;
      }

      const boost = player.dashTimer > 0 ? config.playerDashBoost : 1;
      const step = player.speed * 60 * (1 / 60) * boost;
      player.x += moveX * step;
      player.y += moveY * step;

      player.x = clamp(player.x, 30, world.w - 30);
      player.y = clamp(player.y, 30, world.h - 30);

      if (mouse.down) shoot();

      if ((keys[' '] || keys['Space']) && player.dashCooldown <= 0) {
        dash();
        keys[' '] = false;
        keys['Space'] = false;
      }
    }

    function updatePlayer(dt) {
      if (player.fireCooldown > 0) player.fireCooldown -= dt;
      if (player.dashCooldown > 0) player.dashCooldown -= dt;
      if (player.dashTimer > 0) player.dashTimer -= dt;

      if (player.ammo <= 0 && player.reserveAmmo > 0 && Math.random() < 0.02) {
        const refill = Math.min(1, player.reserveAmmo);
        player.ammo += refill;
        player.reserveAmmo -= refill;
      }
    }

    function updateBullets(dt) {
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx * 60 * dt;
        b.y += b.vy * 60 * dt;
        b.life -= 60 * dt;

        if (b.x < -60 || b.x > world.w + 60 || b.y < -60 || b.y > world.h + 60 || b.life <= 0) {
          bullets.splice(i, 1);
          continue;
        }

        for (let j = enemies.length - 1; j >= 0; j--) {
          const e = enemies[j];
          if (dist(b, e) < b.r + e.r) {
            e.hp -= 1;
            bullets.splice(i, 1);
            spawnParticles(b.x, b.y, 5, '#d7ebff', 0.85);

            if (e.hp <= 0) {
              enemies.splice(j, 1);
              score += 15;
              spawnParticles(e.x, e.y, 18, '#ffcc7a', 1.35);
              if (Math.random() < 0.35) {
                spawnLoot(e.x, e.y, ['medkit', 'ammo', 'armor', 'gun'][Math.floor(Math.random() * 4)]);
              }
            }
            break;
          }
        }
      }
    }

    function updateEnemies(dt) {
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const dx = player.x - e.x;
        const dy = player.y - e.y;
        const len = Math.hypot(dx, dy) || 1;

        e.x += (dx / len) * e.speed * 60 * dt;
        e.y += (dy / len) * e.speed * 60 * dt;

        if (dist(player, e) < player.r + e.r + 4) {
          const rawDamage = 17 * dt * 60 * e.damage;
          let remaining = rawDamage;

          if (player.armor > 0) {
            const absorbed = Math.min(player.armor, remaining * 0.8);
            player.armor -= absorbed;
            remaining -= absorbed;
          }

          player.hp -= remaining;
          spawnParticles(e.x, e.y, 10, '#ff8d6a', 1.2);

          if (player.hp <= 0) {
            player.hp = 0;
            gameState = 'menu';
            showGameOver();
            return;
          }
        }
      }
    }

    function updateSupplyPoints() {
      for (let i = supplyPoints.length - 1; i >= 0; i--) {
        const s = supplyPoints[i];
        if (dist(player, s) < player.r + 18) {
          collected += 1;
          addMissionLoot('补给箱物资', '资源', 1500);
          spawnParticles(s.x, s.y, 22, s.color, 1.5);
          supplyPoints.splice(i, 1);
          score += 50;
        }
      }
    }

    function updateLoot(dt) {
      for (let i = loot.length - 1; i >= 0; i--) {
        const l = loot[i];
        l.pulse += 60 * dt;

        if (dist(player, l) < player.r + l.r + 3) {
          if (l.type === 'medkit') {
            player.hp = Math.min(player.maxHp, player.hp + 32);
          } else if (l.type === 'ammo') {
            player.reserveAmmo = Math.min(240, player.reserveAmmo + 22);
            player.ammo = Math.min(30, player.ammo + 12);
          } else if (l.type === 'armor') {
            player.armor += 25;
          } else if (l.type === 'gun') {
            player.weaponLevel = Math.min(config.maxWeaponLevel, player.weaponLevel + 1);
            score += 35;
          }

          addLootFromPickup(l.type);
          spawnParticles(l.x, l.y, 22, l.type === 'medkit' ? '#7efeb0' : l.type === 'ammo' ? '#ffd866' : l.type === 'armor' ? '#7ec1ff' : '#d7d6ff', 1.5);
          loot.splice(i, 1);
          continue;
        }
      }
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * 60 * dt;
        p.y += p.vy * 60 * dt;
        p.life -= 60 * dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function updateMuzzleFlashes(dt) {
      for (let i = muzzleFlashes.length - 1; i >= 0; i--) {
        const f = muzzleFlashes[i];
        f.life -= dt;
        if (f.life <= 0) muzzleFlashes.splice(i, 1);
      }
    }

    function updateCamera() {
      camera.x = clamp(player.x - canvas.width / 2, 0, world.w - canvas.width);
      camera.y = clamp(player.y - canvas.height / 2, 0, world.h - canvas.height);
    }

    function checkExtraction() {
      if (collected >= config.objectiveTarget && dist(player, extractionZone) < player.r + extractionZone.r) {
        if (!missionCleared) {
          missionCleared = true;
          moveBagToSafe();
          gameState = 'menu';
          startPanel.classList.remove('hidden');
          const box = startPanel.querySelector('.panel-box');
          box.innerHTML = `
            <h1 class="title" style="color: var(--green);">撤离成功</h1>
            <p class="subtitle">
              任务完成。你已从战区撤离。<br>
              物资已存入安全仓库：<strong style="color: var(--gold);">${safeStorage.length}</strong><br>
              当前分数：<strong style="color: var(--blue);">${Math.floor(score)}</strong>
            </p>
            <div class="buttonRow">
              <button id="nextRunBtn">开始下一轮</button>
              <button id="warehouseBtn" class="secondary">查看仓库</button>
            </div>
            <div class="miniLinks">
              <a href="warehouse.html">安全仓库</a>
              <a href="project-delta-rng.html">RNG 市场</a>
              <a href="project-delta-armory.html">武器台</a>
            </div>
            <div class="hint">战场结束后，背包物资将进入仓库。下一次任务会从空背包开始。</div>
          `;

          document.getElementById('nextRunBtn').addEventListener('click', () => {
            startPanel.classList.add('hidden');
            startGame();
          });

          document.getElementById('warehouseBtn').addEventListener('click', () => {
            window.location.href = 'warehouse.html';
          });
        }
      }
    }

    function update(dt) {
      if (gameState !== 'playing') return;

      elapsed = performance.now() - startTimestamp;
      score += dt * 10;

      handleInput();
      updatePlayer(dt);
      updateBullets(dt);
      updateEnemies(dt);
      updateSupplyPoints();
      updateLoot(dt);
      updateParticles(dt);
      updateMuzzleFlashes(dt);
      updateCamera();
      updateMissionInfo();

      if (Math.random() < 0.015 + Math.min(0.025, elapsed / 50000)) {
        spawnEnemy();
      }

      if (Math.random() < 0.012) {
        const x = rand(120, world.w - 120);
        const y = rand(120, world.h - 120);
        if (dist({ x, y }, player) > 420) {
          spawnLoot(x, y, ['medkit', 'ammo', 'armor', 'gun'][Math.floor(Math.random() * 4)]);
        }
      }

      checkExtraction();
      updateHud();
      updateMissionStatus();
    }

    function drawWorld() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const grd = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grd.addColorStop(0, '#091720');
      grd.addColorStop(1, '#0c1d2b');
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(-camera.x, -camera.y);

      ctx.fillStyle = '#0b1a24';
      ctx.fillRect(0, 0, world.w, world.h);

      ctx.strokeStyle = 'rgba(121,216,255,0.08)';
      for (let x = 0; x <= world.w; x += 80) {
        ctx.beginPath();
        ctx.moveTo(x, 0); ctx.lineTo(x, world.h); ctx.stroke();
      }
      for (let y = 0; y <= world.h; y += 80) {
        ctx.beginPath();
        ctx.moveTo(0, y); ctx.lineTo(world.w, y); ctx.stroke();
      }

      ctx.fillStyle = 'rgba(122, 199, 255, 0.06)';
      ctx.fillRect(0, 0, world.w, world.h);

      ctx.fillStyle = 'rgba(92, 210, 168, 0.15)';
      ctx.fillRect(0, 0, 480, 460);
      ctx.fillStyle = 'rgba(255, 214, 108, 0.08)';
      ctx.fillRect(600, 800, 500, 260);
      ctx.fillStyle = 'rgba(120, 140, 255, 0.12)';
      ctx.fillRect(1200, 700, 500, 400);

      ctx.fillStyle = '#6de3b3';
      ctx.beginPath();
      ctx.arc(extractionZone.x, extractionZone.y, extractionZone.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#d5fef1';
      ctx.lineWidth = 2;
      ctx.stroke();

      supplyPoints.forEach((s) => {
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(s.x, s.y, 16, 0, Math.PI * 2);
        ctx.fill();
      });

      loot.forEach((l) => {
        const pulse = 1 + Math.sin(l.pulse * 0.12) * 0.18;
        ctx.save();
        ctx.translate(l.x, l.y);
        ctx.scale(pulse, pulse);

        if (l.type === 'medkit') {
          ctx.fillStyle = '#7efeb0';
          ctx.fillRect(-9, -9, 18, 18);
          ctx.strokeStyle = '#e6fff2';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(0, -7); ctx.lineTo(0, 7);
          ctx.moveTo(-7, 0); ctx.lineTo(7, 0);
          ctx.stroke();
        } else if (l.type === 'ammo') {
          ctx.fillStyle = '#ffd866';
          ctx.fillRect(-10, -7, 20, 14);
          ctx.strokeStyle = '#fff4b3';
          ctx.strokeRect(-10, -7, 20, 14);
        } else if (l.type === 'armor') {
          ctx.fillStyle = '#7ec1ff';
          ctx.beginPath();
          ctx.moveTo(0, -12);
          ctx.lineTo(10, -7);
          ctx.lineTo(10, 7);
          ctx.lineTo(0, 12);
          ctx.lineTo(-10, 7);
          ctx.lineTo(-10, -7);
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.fillStyle = '#d7d6ff';
          ctx.fillRect(-11, -11, 22, 22);
          ctx.fillStyle = '#5f67ff';
          ctx.fillRect(-6, -6, 12, 12);
        }
        ctx.restore();
      });

      enemies.forEach((e) => {
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.fillStyle = 'rgba(0,0,0,0.26)';
        ctx.beginPath();
        ctx.ellipse(0, e.r + 10, e.r + 9, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.arc(0, 0, e.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f9efe5';
        ctx.beginPath();
        ctx.arc(0, -3, e.r * 0.38, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      ctx.fillStyle = '#7ce6b6';
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.angle);
      ctx.fillStyle = '#dfe8f5';
      ctx.fillRect(8, -2, 22, 4);
      ctx.restore();

      particles.forEach((p) => {
        ctx.globalAlpha = Math.max(0, p.life / 60);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
        ctx.globalAlpha = 1;
      });

      muzzleFlashes.forEach((f) => {
        ctx.save();
        ctx.translate(f.x, f.y);
        ctx.rotate(f.angle);
        ctx.fillStyle = `rgba(255, 220, 140, ${Math.max(0, f.life / 0.08)})`;
        ctx.fillRect(0, -2, f.len, 4);
        ctx.restore();
      });

      ctx.restore();

      drawCrosshair();
      drawBars();
    }

    function drawCrosshair() {
      const x = mouse.x;
      const y = mouse.y;
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.8)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(x, y, 12, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x - 16, y); ctx.lineTo(x - 6, y);
      ctx.moveTo(x + 6, y); ctx.lineTo(x + 16, y);
      ctx.moveTo(x, y - 16); ctx.lineTo(x, y - 6);
      ctx.moveTo(x, y + 6); ctx.lineTo(x, y + 16);
      ctx.stroke();
      ctx.restore();
    }

    function drawBars() {
      const x = 20;
      const y = canvas.height - 30;
      const w = 180;
      const h = 12;

      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(x, y, w, h);
      const hpRatio = clamp(player.hp / player.maxHp, 0, 1);
      ctx.fillStyle = hpRatio > 0.5 ? '#70f7a7' : hpRatio > 0.25 ? '#ffd866' : '#ff7a7a';
      ctx.fillRect(x, y, w * hpRatio, h);
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.strokeRect(x, y, w, h);

      const armorW = 120;
      const armorX = canvas.width - 140;
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(armorX, y, armorW, h);
      ctx.fillStyle = '#7ec1ff';
      ctx.fillRect(armorX, y, armorW * clamp(player.armor / 100, 0, 1), h);
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.strokeRect(armorX, y, armorW, h);
    }

    function gameLoop(ts) {
      if (!lastTs) lastTs = ts;
      const dt = Math.min((ts - lastTs) / 1000, 0.032);
      lastTs = ts;
      update(dt);
      drawWorld();

      if (gameState === 'playing') {
        loopId = requestAnimationFrame(gameLoop);
      }
    }

    function extractRun() {
      if (gameState !== 'playing') {
        window.location.href = 'warehouse.html';
        return;
      }
      if (collected >= config.objectiveTarget) {
        checkExtraction();
      } else {
        missionInfoEl.textContent = '目标：还差 ' + (config.objectiveTarget - collected) + ' 个物资，再继续搜集。';
      }
    }

    window.addEventListener('keydown', (e) => {
      keys[e.key] = true;
      if (e.key === ' ') e.preventDefault();
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key] = false;
    });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * canvas.width;
      mouse.y = ((e.clientY - rect.top) / rect.height) * canvas.height;
    });

    canvas.addEventListener('mousedown', (e) => {
      if (e.button === 0) mouse.down = true;
    });

    canvas.addEventListener('mouseup', () => mouse.down = false);
    canvas.addEventListener('mouseleave', () => mouse.down = false);

    window.addEventListener('blur', () => {
      Object.keys(keys).forEach((k) => keys[k] = false);
      mouse.down = false;
    });

    startBtn.addEventListener('click', startGame);
    extractBtn.addEventListener('click', extractRun);
    updateMissionStatus();
    resetGame();
    drawWorld();
  </script>
</body>
</html>
