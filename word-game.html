<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>战场词汇：战术拼词</title>
  <style>
    :root { --bg:#08121b; --panel:rgba(10,22,32,.86); --line:#35627a; --blue:#78d4ff; --green:#78f0b1; --gold:#ffd86b; --red:#ff7b76; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; color:#eef8ff; font-family:"Microsoft YaHei",sans-serif; background:radial-gradient(circle at top,#1c4050 0,#08121b 48%,#050b10 100%); }
    .wrap { width:min(94vw,900px); padding:24px; border:1px solid var(--line); border-radius:20px; background:var(--panel); box-shadow:0 25px 70px #0008; }
    header { display:flex; justify-content:space-between; gap:15px; align-items:center; border-bottom:1px solid #ffffff18; padding-bottom:18px; }
    h1 { margin:0; color:var(--green); letter-spacing:2px; font-size:clamp(25px,5vw,42px); }
    .back { color:var(--blue); text-decoration:none; border:1px solid #78d4ff66; padding:9px 13px; border-radius:9px; }
    .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:20px 0; }
    .stat { padding:12px; text-align:center; border:1px solid #ffffff18; border-radius:10px; background:#ffffff08; }
    .stat b { display:block; margin-top:4px; color:var(--gold); font-size:22px; }
    .mission { color:#b9d5e3; line-height:1.7; margin:0 0 16px; }
    .card { padding:25px; border:1px solid #78d4ff55; border-radius:16px; background:linear-gradient(135deg,#173342aa,#0b1923aa); text-align:center; }
    .category { color:var(--blue); font-size:14px; letter-spacing:1px; }
    .letters { display:flex; justify-content:center; flex-wrap:wrap; gap:10px; margin:22px auto; max-width:650px; }
    .letter { width:54px; height:54px; border:1px solid #78d4ff66; border-radius:10px; display:grid; place-items:center; font-size:27px; font-weight:bold; color:#fff; background:#0b202d; }
    .word { min-height:35px; color:var(--gold); font-size:27px; letter-spacing:5px; }
    input { width:min(100%,470px); padding:15px; border-radius:11px; border:1px solid #78d4ff66; outline:none; background:#061018; color:white; font-size:19px; text-align:center; }
    input:focus { border-color:var(--green); box-shadow:0 0 0 3px #78f0b133; }
    button { margin-top:12px; padding:12px 22px; border:0; border-radius:10px; font-weight:bold; font-size:16px; cursor:pointer; background:linear-gradient(#a8e8ff,#50bfff); color:#041018; }
    button.secondary { margin-left:8px; background:#ffffff14; color:#dceffc; border:1px solid #ffffff2b; }
    #message { min-height:28px; margin-top:16px; font-weight:bold; }
    .good { color:var(--green); } .bad { color:var(--red); }
    .progress { height:10px; margin-top:18px; overflow:hidden; border-radius:20px; background:#ffffff15; }
    #progressBar { height:100%; width:100%; background:linear-gradient(90deg,var(--green),var(--blue)); transition:width .2s; }
    .help { margin-top:20px; color:#a8c0ce; font-size:13px; line-height:1.7; }
    @media(max-width:600px) { .wrap{padding:16px}.stats{grid-template-columns:repeat(2,1fr)} header{align-items:flex-start;flex-direction:column}.letter{width:43px;height:43px;font-size:21px} }
  </style>
</head>
<body>
  <main class="wrap">
    <header><h1>战场词汇：战术拼词</h1><a class="back" href="index.html">返回射击游戏</a></header>
    <p class="mission">从字母中拼出正确的英文战术词汇。答对可以获得情报分，连续答对会有连击奖励；倒计时结束前完成任务！</p>
    <section class="stats">
      <div class="stat">情报分<b id="score">0</b></div><div class="stat">任务<b id="round">1/10</b></div><div class="stat">连击<b id="streak">0</b></div><div class="stat">时间<b id="time">20</b></div>
    </section>
    <section class="card">
      <div class="category" id="category">任务目标</div>
      <div class="letters" id="letters"></div>
      <div class="word" id="word">请输入答案</div>
      <input id="answer" autocomplete="off" spellcheck="false" placeholder="输入英文单词" />
      <br />
      <button id="submit">提交答案</button><button class="secondary" id="hint">显示提示</button>
      <div id="message"></div>
      <div class="progress"><div id="progressBar"></div></div>
    </section>
    <div class="help">操作：输入英文单词后按 Enter。每局 10 个词。词库包括 soldier、armor、ammo、medic、extract、scout、sniper、rifle、supply、mission 等战术词汇。</div>
  </main>
  <script>
    const words = [
      ["SOLDIER","士兵"],["ARMOR","装甲"],["AMMO","弹药"],["MEDIC","医疗兵"],["EXTRACT","撤离"],
      ["SCOUT","侦察兵"],["SNIPER","狙击手"],["RIFLE","步枪"],["SUPPLY","补给"],["MISSION","任务"],
      ["SQUAD","小队"],["RADIO","无线电"],["TACTIC","战术"],["TARGET","目标"],["LOOT","战利品"],
      ["HELMET","头盔"],["BUNKER","碉堡"],["DRONE","无人机"],["PATROL","巡逻"],["RESCUE","救援"]
    ];
    const $ = id => document.getElementById(id);
    let current, round=1, score=0, streak=0, time=20, timer, used=[];
    function shuffle(a){ return [...a].sort(()=>Math.random()-.5); }
    function newWord(){
      if(round>10){ finish(); return; }
      let available=words.filter((_,i)=>!used.includes(i));
      if(!available.length) { used=[]; available=words; }
      const pick=available[Math.floor(Math.random()*available.length)];
      current=pick; used.push(words.indexOf(pick));
      $("category").textContent=`战术词汇 · ${pick[1]}`;
      $("letters").innerHTML=shuffle(pick[0].split("")).map(x=>`<span class="letter">${x}</span>`).join("");
      $("word").textContent="请输入答案"; $("answer").value=""; $("answer").focus();
      $("round").textContent=`${round}/10`; time=20; update(); clearInterval(timer); timer=setInterval(tick,1000);
    }
    function update(){ $("score").textContent=score; $("streak").textContent=streak; $("time").textContent=time; $("progressBar").style.width=(time/20*100)+"%"; }
    function tick(){ time--; update(); if(time<=0){ clearInterval(timer); answer(false,"时间到！答案是 "+current[0]); } }
    function answer(correct,message){
      clearInterval(timer); const m=$("message"); m.textContent=message; m.className=correct?"good":"bad";
      if(correct){ score+=100+streak*25; streak++; } else streak=0;
      update();
      setTimeout(()=>{ round++; newWord(); },900);
    }
    function submit(){ if(!current)return; const value=$("answer").value.trim().toUpperCase(); if(!value)return; if(value===current[0]) answer(true,"命中！获得情报分。"); else answer(false,"答案错误，正确答案是 "+current[0]); }
    function finish(){ clearInterval(timer); $("category").textContent="任务完成"; $("letters").innerHTML="🏆"; $("word").textContent=`最终情报分：${score}`; $("message").textContent="优秀，行动小队成功撤离！"; $("message").className="good"; $("answer").style.display="none"; $("submit").textContent="再来一局"; $("submit").onclick=()=>location.reload(); $("hint").style.display="none"; }
    $("submit").onclick=submit;
    $("hint").onclick=()=>{ if(current){ $("word").textContent=`提示：${current[1]}（${current[0][0]}开头）`; score=Math.max(0,score-10); update(); } };
    $("answer").addEventListener("keydown",e=>{if(e.key==="Enter")submit()});
    newWord();
  </script>
</body>
</html>
