<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>战场词汇：掠夺箱</title>
  <style>
    :root {
      --bg:#07131d;
      --bg2:#0d1d2a;
      --panel:#0d1f2b;
      --line:#3a6687;
      --blue:#7fd5ff;
      --green:#7ef2b2;
      --gold:#ffd86a;
      --red:#ff7d7d;
      --purple:#d0c9ff;
      --white:#edf7ff;
    }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100vh; } 
    body {
      display:flex; align-items:center; justify-content:center;
      font-family:"Microsoft YaHei",sans-serif;
      background:radial-gradient(circle at top,#20475a 0%,#08131c 40%,#040a10 100%);
      color:var(--white);
      padding:18px;
    }
    .game {
      width:min(95vw, 980px);
      background:rgba(12,22,31,.9);
      border:1px solid var(--line);
      border-radius:22px;
      box-shadow:0 28px 70px rgba(0,0,0,.45);
      padding:22px;
    }
    header {
      display:flex; justify-content:space-between; align-items:center; gap:12px; padding-bottom:16px; border-bottom:1px solid #ffffff12;
    }
    h1 {
      margin:0; color:var(--green); letter-spacing:2px; font-size:clamp(26px,4vw,42px);
    }
    .nav {
      text-decoration:none; color:var(--blue); border:1px solid #7fd5ff88; border-radius:10px; padding:9px 12px; font-weight:700;
    }
    .topbar {
      display:grid; grid-template-columns:repeat(4, minmax(120px, 1fr)); gap:12px; margin:20px 0;
    }
    .stat {
      background:#ffffff09; border:1px solid #ffffff18; border-radius:12px; text-align:center; padding:14px 10px;
    }
    .stat small { display:block; color:#c7dcea; }
    .stat strong { display:block; margin-top:6px; font-size:26px; color:var(--gold); }
    .mission {
      background:linear-gradient(135deg,#102a3a,#0d1d2a); border:1px solid #7fd5ff55; border-radius:16px; padding:18px 20px; margin-bottom:18px;
    }
    .mission p { margin:0; line-height:1.7; color:#d5ebf9; }
    .crate-wrap {
      display:grid; grid-template-columns:repeat(3, minmax(180px, 1fr)); gap:16px; margin:18px 0 16px;
    }
    .crate {
      min-height:220px; border-radius:18px; padding:18px 14px; border:1px solid #8cc8e9aa; background:linear-gradient(180deg,#11314a,#102635);
      position:relative; overflow:hidden; text-align:center;
    }
    .crate::before {
      content:""; position:absolute; inset:0; background:linear-gradient(140deg,#ffffff08,#ffffff00 30%,#ffffff08 100%);
    }
    .crate .label { position:relative; z-index:1; font-size:12px; letter-spacing:2px; color:var(--blue); }
    .crate .letters {
      position:relative; z-index:1; display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin:20px auto 10px; min-height:64px;
    }
    .crate .letter {
      width:32px; height:32px; border-radius:8px; background:#071922; border:1px solid #7fd5ff66; display:grid; place-items:center; font-weight:900; color:#effaff;
    }
    .crate .status {
      position:relative; z-index:1; display:inline-block; margin-top:12px; padding:6px 10px; border-radius:999px; font-size:12px; border:1px solid #ffffff18; background:#ffffff08; color:#dfeff7;
    }
    .active { border-color:var(--green); box-shadow:0 0 0 2px rgba(126,242,178,.15); }
    .opened { border-color:var(--gold); background:linear-gradient(180deg,#314524,#182d17); }
    .opened .status { background:#ffd96a22; color:var(--gold); border-color:#ffd96a66; }
    .play {
      display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:center; margin-top:6px;
    }
    input {
      width:100%; padding:16px 18px; border-radius:12px; border:1px solid #7fd5ff66; background:#061018; color:#f6fbff; font-size:18px; text-align:center; outline:none;
    }
    input:focus { border-color:var(--green); box-shadow:0 0 0 3px rgba(126,242,178,.14); }
    button {
      border:0; border-radius:12px; padding:16px 18px; font-weight:800; cursor:pointer; color:#041018; background:linear-gradient(180deg,#a9eaff,#55beff);
      box-shadow:0 12px 20px rgba(85,190,255,.24); font-size:16px;
    }
    button.secondary {
      background:rgba(255,255,255,.08); color:#e7f5ff; border:1px solid #ffffff18; box-shadow:none;
    }
    #message {
      min-height:32px; margin-top:16px; font-weight:700; font-size:16px; text-align:center;
    }
    .good { color:var(--green); }
    .bad { color:var(--red); }
    .hint {
      margin-top:18px; color:#c3d7e4; text-align:center; font-size:13px; line-height:1.8;
    }
    @media(max-width:760px){
      .crate-wrap { grid-template-columns:1fr; }
      .topbar{ grid-template-columns:repeat(2,1fr); }
      .play { grid-template-columns:1fr; }
      header { flex-direction:column; align-items:flex-start; }
    }
  </style>
</head>
<body>
  <div class="game">
    <header>
      <h1>战场词汇：掠夺箱</h1>
      <a class="nav" href="index.html">返回射击游戏</a>
    </header>

    <div class="topbar">
      <div class="stat"><small>情报分</small><strong id="score">0</strong></div>
      <div class="stat"><small>箱子</small><strong id="crateCount">0</strong></div>
      <div class="stat"><small>连击</small><strong id="streak">0</strong></div>
      <div class="stat"><small>时间</small><strong id="time">30</strong></div>
    </div>

    <div class="mission">
      <p>目标：在倒计时内，破解每个掠夺箱中的战术英文单词。正确答案会打开箱子，获得补给和积分。错误会消耗时间与连击。</p>
    </div>

    <div class="crate-wrap" id="crateWrap"></div>

    <div class="play">
      <input id="answer" autocomplete="off" spellcheck="false" placeholder="输入正确英文单词" />
      <button id="submit">打开箱子</button>
      <button class="secondary" id="hint">提示</button>
    </div>

    <div id="message"></div>
    <div class="hint">提示：词库包括 AMMO、RIFLE、MEDIC、ARMOR、LOOT、MISSION、RESCUE、TARGET、SNIPER、SUPPLY 等战术单词。</div>
  </div>

  <script>
    const words = [
      ["AMMO","弹药"], ["RIFLE","步枪"], ["MEDIC","医疗兵"], ["ARMOR","装甲"], ["LOOT","掠夺"],
      ["TARGET","目标"], ["RESCUE","救援"], ["SNIPER","狙击手"], ["SUPPLY","补给"], ["MISSION","任务"],
      ["DRONE","无人机"], ["SCOUT","侦察"], ["TACTIC","战术"], ["BUNKER","碉堡"], ["HELMET","头盔"],
      ["RADIO","电台"], ["SQUAD","小队"], ["SECURE","安全"], ["EXTRACT","撤离"], ["ALERT","警戒"]
    ];

    const $ = (id) => document.getElementById(id);
    const scoreEl = $("score");
    const crateCountEl = $("crateCount");
    const streakEl = $("streak");
    const timeEl = $("time");
    const crateWrap = $("crateWrap");
    const answerInput = $("answer");
    const messageEl = $("message");

    let score = 0;
    let streak = 0;
    let timeLeft = 30;
    let timer = null;
    let opened = 0;
    let currentWords = [];
    let activeIndex = 0;
    let currentTarget = null;

    function shuffle(array) {
      return array.slice().sort(() => Math.random() - 0.5);
    }

    function renderCrates() {
      crateWrap.innerHTML = "";
      currentWords.forEach((item, idx) => {
        const div = document.createElement("div");
        div.className = "crate" + (idx === activeIndex ? " active" : "") + (item.opened ? " opened" : "");
        div.innerHTML = `
          <div class="label">${item.type}</div>
          <div class="letters">${shuffle(item.word.split("")).map(c => `<span class="letter">${c}</span>`).join("")}</div>
          <div class="status">${item.opened ? "已开箱" : "待解锁"}</div>
        `;
        div.addEventListener("click", () => { activeIndex = idx; answerInput.focus(); updateActive(); });
        crateWrap.appendChild(div);
      });
    }

    function updateActive() {
      const crates = document.querySelectorAll(".crate");
      crates.forEach((node, idx) => node.classList.toggle("active", idx === activeIndex));
    }

    function refreshStats() {
      scoreEl.textContent = score;
      crateCountEl.textContent = opened;
      streakEl.textContent = streak;
      timeEl.textContent = timeLeft;
    }

    function createRound() {
      const pool = shuffle(words.slice());
      const items = [];
      for (let i = 0; i < 3; i++) {
        const [word, meaning] = pool[i];
        items.push({
          word,
          meaning,
          type: i === 0 ? "军械箱" : i === 1 ? "医疗箱" : "补给箱",
          opened: false
        });
      }
      currentWords = items;
      activeIndex = 0;
      currentTarget = currentWords[0];
      answerInput.value = "";
      answerInput.placeholder = `输入 ${currentTarget.type} 对应英文单词`;
      renderCrates();
      refreshStats();
      messageEl.textContent = "选择一个箱子并输入答案。";
      messageEl.className = "";
      answerInput.focus();
    }

    function tick() {
      timeLeft -= 1;
      refreshStats();
      if (timeLeft <= 0) {
        clearInterval(timer);
        messageEl.textContent = "时间到！本次任务结束。";
        messageEl.className = "bad";
        $("submit").textContent = "再来一局";
        $("submit").onclick = () => location.reload();
        $("hint").disabled = true;
        answerInput.disabled = true;
      }
    }

    function startTimer() {
      clearInterval(timer);
      timer = setInterval(tick, 1000);
    }

    function submitAnswer() {
      if (!currentWords.length || timeLeft <= 0) return;
      const value = answerInput.value.trim().toUpperCase();
      const target = currentWords[activeIndex];
      if (!value) {
        messageEl.textContent = "请输入答案。";
        messageEl.className = "bad";
        return;
      }

      if (value === target.word) {
        target.opened = true;
        opened += 1;
        streak += 1;
        score += 100 + streak * 25;
        messageEl.textContent = `正确！已打开 ${target.type}，获得 ${target.meaning} 物资。`;
        messageEl.className = "good";
        answerInput.value = "";

        const nextIndex = currentWords.findIndex(item => !item.opened);
        if (nextIndex !== -1) {
          activeIndex = nextIndex;
          currentTarget = currentWords[nextIndex];
          answerInput.placeholder = `输入 ${currentTarget.type} 对应英文单词`;
        } else {
          clearInterval(timer);
          messageEl.textContent = `任务完成！本轮总分：${score}`;
          messageEl.className = "good";
          $("submit").textContent = "再来一局";
          $("submit").onclick = () => location.reload();
          $("hint").disabled = true;
          answerInput.disabled = true;
          return;
        }
      } else {
        streak = 0;
        score = Math.max(0, score - 20);
        messageEl.textContent = `错误！正确答案是 ${target.word}，对应 ${target.meaning}。`;
        messageEl.className = "bad";
      }

      refreshStats();
      renderCrates();
      answerInput.focus();
    }

    function showHint() {
      const target = currentWords[activeIndex];
      messageEl.textContent = `提示：${target.type} 对应词义为 ${target.meaning}，首字母 ${target.word[0]}`;
      messageEl.className = "";
      score = Math.max(0, score - 10);
      refreshStats();
    }

    $("submit").addEventListener("click", submitAnswer);
    $("hint").addEventListener("click", showHint);
    answerInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") submitAnswer();
    });

    createRound();
    startTimer();
    refreshStats();
  </script>
</body>
</html>
