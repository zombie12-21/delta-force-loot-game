<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Delta：全域掠夺</title>
<style>
:root{--bg:#061018;--panel:#0d1d29;--line:#2e607c;--text:#eaf7ff;--blue:#7bd7ff;--green:#7df2b0;--gold:#ffd566;--red:#ff7777;--purple:#c8baff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1d4558,#071019 52%,#03070b);font-family:Arial,"Microsoft YaHei",sans-serif;color:var(--text);padding:16px}.app{width:min(1200px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}.title h1{margin:0;color:var(--green);letter-spacing:2px;font-size:clamp(25px,4vw,42px)}.title p{margin:5px 0;color:#b9d4e2}.links a{color:var(--blue);text-decoration:none;border:1px solid #7bd7ff66;border-radius:9px;padding:9px 12px;margin-left:5px}.hud{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:15px}.stat{padding:10px;border:1px solid #ffffff1c;border-radius:10px;background:#ffffff08;text-align:center}.stat small{display:block;color:#b9d4e2}.stat b{display:block;margin-top:5px;color:var(--gold);font-size:21px}.mission{border:1px solid #7bd7ff55;border-radius:13px;padding:13px 16px;background:#102c3aaa;margin-bottom:15px;color:#d6eaf4;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.crate{min-height:190px;padding:13px;border:1px solid #5b8094;border-radius:14px;background:linear-gradient(145deg,#153344,#0a1a24);position:relative;cursor:pointer;transition:.15s;overflow:hidden}.crate:hover{transform:translateY(-2px);border-color:var(--blue)}.crate.active{border-color:var(--green);box-shadow:0 0 0 2px #7df2b022}.crate.open{border-color:var(--gold);background:linear-gradient(145deg,#394428,#18271b)}.crate .rarity{font-size:11px;letter-spacing:1px;color:var(--purple)}.crate .name{font-weight:bold;margin-top:5px}.crate .meaning{font-size:12px;color:#bed6e1;margin-top:4px}.letters{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin:16px 0 10px}.letter{width:24px;height:27px;display:grid;place-items:center;border:1px solid #7bd7ff66;border-radius:5px;background:#06131b;font-weight:bold;font-size:13px}.crate.open .letter{border-color:#ffd56699;color:var(--gold)}.state{font-size:11px;color:#c6d8df;text-align:center}.bottom{display:grid;grid-template-columns:1fr auto auto;gap:9px;margin-top:15px}input{width:100%;padding:14px;border-radius:10px;border:1px solid #7bd7ff66;background:#061018;color:white;font-size:17px;text-align:center;outline:none}input:focus{border-color:var(--green)}button{border:0;border-radius:10px;padding:13px 18px;background:linear-gradient(#a8eaff,#50baff);font-weight:bold;font-size:15px;cursor:pointer;color:#041018}button.alt{background:#ffffff12;color:var(--text);border:1px solid #ffffff25}.message{text-align:center;min-height:28px;margin-top:12px;font-weight:bold}.good{color:var(--green)}.bad{color:var(--red)}.legend{margin-top:14px;color:#a9c4d1;font-size:12px;line-height:1.8}@media(max-width:850px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.hud{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.bottom{grid-template-columns:1fr}.links{width:100%}.links a{display:inline-block;margin:5px 3px 0 0}}@media(max-width:370px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main class="app">
<div class="top"><div class="title"><h1>PROJECT DELTA：全域掠夺</h1><p>战术单词 · 多重箱区 · 物资撤离</p></div><div class="links"><a href="index.html">射击游戏</a><a href="word-game.html">基础词汇</a></div></div>
<div class="hud"><div class="stat"><small>情报分</small><b id="score">0</b></div><div class="stat"><small>已开箱</small><b id="opened">0/12</b></div><div class="stat"><small>连击</small><b id="streak">0</b></div><div class="stat"><small>撤离时间</small><b id="time">90</b></div><div class="stat"><small>战利品价值</small><b id="value">0</b></div></div>
<div class="mission">任务：点击任意箱子，观察打乱的字母，输入对应英文单词来破解它。所有箱子的答案都是单词；稀有箱奖励更高。完成全部 12 个箱子后成功撤离。</div>
<section class="grid" id="grid"></section>
<div class="bottom"><input id="answer" autocomplete="off" spellcheck="false" placeholder="输入当前箱子的英文单词"><button id="openBtn">破解并开箱</button><button class="alt" id="hintBtn">情报提示</button></div>
<div class="message" id="message">选择一个箱子开始搜刮。</div>
<div class="legend">箱子类型：弹药箱、医疗箱、护甲箱、武器箱、情报箱、补给箱、侦察箱、战术箱、撤离箱、稀有箱、黑金箱、指挥箱。这里使用原创网页玩法，不复制任何官方游戏资产。</div>
</main>
<script>
const crates=[
 ['弹药箱','AMMO','弹药','普通',100],['医疗箱','MEDIC','医疗兵','普通',110],['护甲箱','ARMOR','装甲','普通',120],['武器箱','RIFLE','步枪','稀有',160],
 ['情报箱','INTEL','情报','稀有',180],['补给箱','SUPPLY','补给','普通',130],['侦察箱','SCOUT','侦察','稀有',170],['战术箱','TACTIC','战术','稀有',190],
 ['撤离箱','EXTRACT','撤离','史诗',250],['稀有箱','RARE','稀有','史诗',280],['黑金箱','BLACKGOLD','黑金','传奇',360],['指挥箱','COMMAND','指挥','传奇',400]
];
const $=id=>document.getElementById(id);let data=[],active=0,score=0,opened=0,streak=0,value=0,time=90,timer;
function mix(a){return [...a].sort(()=>Math.random()-.5)}
function newRun(){data=crates.map(x=>({type:x[0],word:x[1],meaning:x[2],rarity:x[3],reward:x[4],open:false}));active=0;score=0;opened=0;streak=0;value=0;time=90;render();refresh();clearInterval(timer);timer=setInterval(()=>{time--;refresh();if(time<=0)finish('时间耗尽，行动失败。')},1000)}
function render(){ $('grid').innerHTML='';data.forEach((c,i)=>{let el=document.createElement('article');el.className='crate '+(i===active?'active ':'')+(c.open?'open':'');el.innerHTML=`<div class="rarity">${c.rarity} · ${c.reward} XP</div><div class="name">${c.type}</div><div class="meaning">${c.open?'获得：'+c.meaning:'未知战利品'}</div><div class="letters">${mix(c.word.split('')).map(x=>`<span class="letter">${x}</span>`).join('')}</div><div class="state">${c.open?'已打开':'待破解'}</div>`;el.onclick=()=>{if(!c.open){active=i;msg('当前目标：'+c.type,'');render();$('answer').focus()}};$('grid').appendChild(el)})}
function refresh(){$('score').textContent=score;$('opened').textContent=opened+'/12';$('streak').textContent=streak;$('time').textContent=Math.max(0,time);$('value').textContent=value}
function msg(text,kind){$('message').textContent=text;$('message').className='message '+kind}
function submit(){if(time<=0)return;let c=data[active],answer=$('answer').value.trim().toUpperCase();if(!answer){msg('请输入英文单词。','bad');return}if(c.open){msg('这个箱子已经打开，请选择其他箱子。','bad');return}if(answer===c.word){c.open=true;opened++;streak++;score+=c.reward+streak*20;value+=c.reward;msg('破解成功！获得 '+c.meaning+'，战利品价值 +'+c.reward,'good');let next=data.findIndex(x=>!x.open);if(next>=0)active=next;else finish('全部箱子已搜刮，成功撤离！');$('answer').value=''}else{streak=0;score=Math.max(0,score-25);time=Math.max(0,time-4);msg('密码错误，扣除 4 秒。提示：'+c.meaning,'bad')}render();refresh();$('answer').focus()}
function hint(){let c=data[active];if(c.open)return;score=Math.max(0,score-15);time=Math.max(0,time-2);msg('情报：中文意思是“'+c.meaning+'”，首字母是 '+c.word[0]+'，长度 '+c.word.length+'。','') ;refresh()}
function finish(text){clearInterval(timer);time=0;refresh();msg(text+' 最终分数：'+score+'，战利品价值：'+value,'good');$('openBtn').textContent='重新行动';$('openBtn').onclick=()=>location.reload();$('hintBtn').disabled=true;$('answer').disabled=true}
$('openBtn').onclick=submit;$('hintBtn').onclick=hint;$('answer').onkeydown=e=>{if(e.key==='Enter')submit()};newRun();
</script></body></html>
