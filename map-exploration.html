<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Delta：四区探索</title>
<style>
:root{--bg:#071018;--panel:#0c1c28;--line:#35627c;--text:#edf7ff;--muted:#9eb9c8;--blue:#79d8ff;--green:#7cf2b1;--gold:#ffd568;--red:#ff7979;--purple:#d0b7ff}*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at top,#214b5d,#071018 48%,#03070b);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif}.app{max-width:1200px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.top h1{margin:0;color:var(--green);letter-spacing:2px;font-size:clamp(25px,4vw,43px)}.top p{margin:5px 0;color:var(--muted)}a{color:var(--blue);border:1px solid #79d8ff66;border-radius:9px;padding:9px 12px;text-decoration:none}.hud{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:16px 0}.stat{padding:10px;text-align:center;background:#ffffff09;border:1px solid #ffffff18;border-radius:10px}.stat small{display:block;color:var(--muted)}.stat b{display:block;color:var(--gold);font-size:20px;margin-top:4px}.layout{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}.panel{padding:15px;border:1px solid var(--line);border-radius:15px;background:rgba(12,28,40,.92)}h2{margin:0 0 12px;color:var(--blue);font-size:20px}.map{position:relative;min-height:510px;border-radius:13px;overflow:hidden;border:1px solid #79d8ff55;background-color:#17382e;background-image:linear-gradient(#ffffff0b 1px,transparent 1px),linear-gradient(90deg,#ffffff0b 1px,transparent 1px);background-size:42px 42px}.map:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 28% 32%,#7d8f5525 0 16%,transparent 17%),radial-gradient(circle at 74% 61%,#314d802b 0 19%,transparent 20%),linear-gradient(125deg,transparent 42%,#77956c16 43% 46%,transparent 47%)}.map-title{position:absolute;top:12px;left:14px;z-index:2;color:#d8f5dc;letter-spacing:1px}.building{position:absolute;z-index:3;min-width:100px;min-height:55px;padding:9px 7px;border:2px solid #b9d6dfaa;border-radius:8px;background:#152837dd;color:#f4fbff;cursor:pointer;text-align:center;font-size:12px;box-shadow:0 4px 12px #0008}.building:hover{border-color:var(--green);transform:scale(1.04)}.building.special{border-color:var(--purple);background:#302342ee}.building.crate{border-color:var(--gold);background:#493a1eee}.b1{left:9%;top:19%}.b2{left:39%;top:25%}.b3{right:8%;top:17%}.b4{left:16%;bottom:16%}.b5{left:49%;bottom:13%}.b6{right:9%;bottom:19%}.building small{display:block;color:var(--muted);margin-top:5px}.side{display:grid;gap:14px}.box{border:1px solid #ffffff18;border-radius:11px;padding:13px;background:#ffffff08}.box h3{margin:0 0 8px;color:var(--gold)}.search{width:100%;padding:13px;border:0;border-radius:9px;background:linear-gradient(#a8eaff,#51bfff);font-weight:bold;font-size:15px;cursor:pointer;color:#061018}.search:disabled{opacity:.45}.log{height:190px;overflow:auto;font-size:12px;color:#c6dbe5;line-height:1.65}.log div{border-bottom:1px solid #ffffff0b;padding:5px 0}.battle{padding:12px;border:1px solid #ff797966;border-radius:10px;background:#371d25aa;color:#ffd9d9}.battle h3{margin:0 0 8px;color:var(--red)}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{border:1px solid #ffffff25;border-radius:8px;padding:9px 11px;background:#ffffff12;color:var(--text);cursor:pointer}.actions button:first-child{background:#ff6f6f;color:#180607}.loot{display:grid;gap:6px;max-height:150px;overflow:auto}.item{padding:8px;border:1px solid #ffffff12;border-radius:7px;background:#ffffff08;font-size:12px}.legendary{color:var(--gold)}.epic{color:var(--purple)}.rare{color:var(--blue)}.good{color:var(--green)}.bad{color:var(--red)}@media(max-width:850px){.layout{grid-template-columns:1fr}.hud{grid-template-columns:repeat(3,1fr)}}@media(max-width:520px){.hud{grid-template-columns:repeat(2,1fr)}.map{min-height:430px}.building{min-width:82px;font-size:10px}}
</style>
</head>
<body><main class="app"><header class="top"><div><h1>PROJECT DELTA：四区探索</h1><p>搜索区域 · 小地图建筑 · 战斗 · Boss · 特殊任务</p></div><a href="project-delta-rng.html">返回 RNG 市场</a></header>
<section class="hud"><div class="stat"><small>当前地图</small><b id="mapName">森林边境</b></div><div class="stat"><small>生命</small><b id="hp">100</b></div><div class="stat"><small>现金</small><b id="cash">10000</b></div><div class="stat"><small>搜索次数</small><b id="searches">0</b></div><div class="stat"><small>战利品价值</small><b id="value">0</b></div></section>
<div class="layout"><section class="panel"><h2>小地图：点击建筑进入</h2><div class="map"><div class="map-title" id="mapSubtitle">MAP 01 · 森林边境</div><button class="building b1" data-building="仓库">仓库<small>普通物资</small></button><button class="building b2 special" data-building="通讯塔">通讯塔<small>特殊任务</small></button><button class="building b3" data-building="检查站">检查站<small>弹药</small></button><button class="building b4" data-building="医疗站">医疗站<small>医疗物资</small></button><button class="building b5 special" data-building="地下实验室">地下实验室<small>特殊 Boss</small></button><button class="building b6 crate" data-building="撤离点">撤离点<small>安全撤离</small></button></div></section>
<section class="side"><div class="box"><h3>四张地图</h3><div class="actions" id="maps"></div></div><div class="box"><h3>区域搜索</h3><button class="search" id="searchBtn">搜索当前区域（25% 遭遇敌人）</button><p id="searchText" class="good">每次点击搜索，25% 概率进入战斗。</p></div><div id="battleBox"></div><div class="box"><h3>行动日志</h3><div class="log" id="log"></div></div><div class="box"><h3>本局战利品</h3><div class="loot" id="loot"><span style="color:var(--muted)">还没有战利品。</span></div></div></section></div></main>
<script>
const maps=[['森林边境','MAP 01'],['沙漠军港','MAP 02'],['雪地研究区','MAP 03'],['黑区核心','MAP 04']];
const buildings={ '森林边境':['普通仓库','通讯塔','边境检查站','野战医疗站','地下实验室','撤离点'], '沙漠军港':['集装箱区','雷达塔','港口军械库','燃料站','舰桥指挥室','撤离点'], '雪地研究区':['冷库','气象站','雪地实验室','研究宿舍','量子实验室','撤离点'], '黑区核心':['黑市入口','数据中心','指挥中心','终极军械库','Project Delta 核心舱','特殊 Crate']};
const mapEl=document.querySelector('.map'),mapNameEl=document.getElementById('mapName'),subtitle=document.getElementById('mapSubtitle'),hpEl=document.getElementById('hp'),cashEl=document.getElementById('cash'),searchEl=document.getElementById('searches'),valueEl=document.getElementById('value'),logEl=document.getElementById('log'),lootEl=document.getElementById('loot'),battleEl=document.getElementById('battleBox'),searchBtn=document.getElementById('searchBtn');
let mapIndex=0,hp=100,cash=10000,searches=0,value=0,inBattle=false,currentBuilding='';let loot=[];
const special=['通讯塔','地下实验室','雷达塔','舰桥指挥室','气象站','量子实验室','数据中心','指挥中心','终极军械库','Project Delta 核心舱','特殊 Crate'];
function log(text,cls=''){let d=document.createElement('div');d.className=cls;d.textContent='› '+text;logEl.prepend(d)}
function refresh(){mapNameEl.textContent=maps[mapIndex][0];subtitle.textContent=maps[mapIndex][1]+' · '+maps[mapIndex][0];hpEl.textContent=hp;cashEl.textContent=cash.toLocaleString();searchEl.textContent=searches;valueEl.textContent=value.toLocaleString()}
function renderMaps(){document.getElementById('maps').innerHTML=maps.map((m,i)=>`<button ${i===mapIndex?'disabled':''} data-map="${i}">${m[1]}<br>${m[0]}</button>`).join('');document.querySelectorAll('[data-map]').forEach(b=>b.onclick=()=>{mapIndex=+b.dataset.map;buildMap();log('移动到 '+maps[mapIndex][0]);refresh()})}
function buildMap(){document.querySelectorAll('.building').forEach((b,i)=>{let n=buildings[maps[mapIndex][0]][i];b.innerHTML=n+'<small>'+ (n==='特殊 Crate'?'地图专属战利品':special.includes(n)?'特殊任务 / Boss':'搜索物资')+'</small>';b.dataset.building=n;b.classList.toggle('special',special.includes(n));b.classList.toggle('crate',n==='特殊 Crate')});renderMaps();refresh()}
function giveLoot(name,price,rarity='rare'){loot.unshift({name,price,rarity});value+=price;cash+=price;lootEl.innerHTML=loot.map(x=>`<div class="item ${x.rarity}">${x.name} · ${x.rarity} · $${x.price.toLocaleString()}</div>`).join('');refresh()}
function startBattle(label,boss=false){inBattle=true;searchBtn.disabled=true;let enemy=boss?'特殊 Boss：'+label:'敌方巡逻队';battleEl.innerHTML=`<div class="battle"><h3>${enemy} 出现！</h3><p>${boss?'特殊建筑触发 Boss 战，击败它才能获得高级奖励。':'搜索时遭遇敌人，选择战斗或撤退。'}</p><div class="actions"><button id="fight">战斗</button><button id="run">撤退</button></div></div>`;document.getElementById('fight').onclick=()=>{let damage=boss?25:12;hp-=damage;if(hp<=0){hp=0;log('战斗失败，失去部分现金。','bad');cash=Math.max(0,cash-1000);hp=60}else{let reward=boss?4500:800;giveLoot(boss?'Boss 核心战利品':'敌人掉落物',reward,boss?'legendary':'uncommon');log((boss?'Boss ':'敌人')+'已击败，获得战利品。','good')}endBattle()};document.getElementById('run').onclick=()=>{hp=Math.max(1,hp-5);log('你撤离了战斗现场，损失 5 点生命。','bad');endBattle()}}
function endBattle(){inBattle=false;searchBtn.disabled=false;battleEl.innerHTML='';refresh()}
searchBtn.onclick=()=>{if(inBattle)return;searches++;if(Math.random()<.25)startBattle('区域敌人');else{let reward=150+Math.floor(Math.random()*700);giveLoot('搜索发现的补给',reward,'common');log('搜索成功，没有遇到敌人，发现补给。','good')}refresh()};
document.querySelectorAll('.building').forEach(b=>b.onclick=()=>{if(inBattle)return;currentBuilding=b.dataset.building;log('进入建筑：'+currentBuilding);if(currentBuilding==='特殊 Crate'){giveLoot('黑区特殊 Crate',9000,'legendary');log('地图 4 特殊 Crate 已开启！','good')}else if(special.includes(currentBuilding)){startBattle(currentBuilding,true)}else{let reward=400+Math.floor(Math.random()*1200);giveLoot(currentBuilding+' 物资',reward,'rare')}});buildMap();log('行动开始：选择地图或点击建筑。');
</script></body></html>
