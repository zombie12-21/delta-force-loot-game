<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Delta：武器改装台</title>
<style>
:root{--bg:#071018;--panel:#0d1d29;--line:#35627c;--text:#edf7ff;--muted:#9eb9c8;--blue:#79d8ff;--green:#7cf2b1;--gold:#ffd568;--purple:#d0b7ff}*{box-sizing:border-box}body{margin:0;padding:18px;background:radial-gradient(circle at top,#20495b,#071018 52%,#03070b);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif}.app{width:min(1100px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.top h1{margin:0;color:var(--green);letter-spacing:2px;font-size:clamp(25px,4vw,42px)}.top p{margin:6px 0;color:var(--muted)}a{color:var(--blue);border:1px solid #79d8ff66;border-radius:9px;padding:9px 12px;text-decoration:none}.layout{display:grid;grid-template-columns:.75fr 1.25fr;gap:15px;margin-top:18px}.panel{padding:16px;border:1px solid var(--line);border-radius:15px;background:rgba(13,29,41,.92)}h2{margin:0 0 12px;color:var(--blue);font-size:20px}.guns,.parts{display:grid;gap:8px}.choice{padding:11px;border:1px solid #ffffff18;border-radius:9px;background:#ffffff08;cursor:pointer}.choice:hover,.choice.active{border-color:var(--green);box-shadow:0 0 0 2px #7cf2b122}.choice b{display:block}.choice small{color:var(--muted)}.weapon{padding:15px;border-radius:13px;background:linear-gradient(145deg,#153747,#0b1923);border:1px solid #79d8ff55}.weapon h3{margin:0;color:var(--gold);font-size:23px}.weapon p{color:var(--muted);margin:6px 0 14px}.bars{display:grid;gap:8px}.barrow{display:grid;grid-template-columns:75px 1fr 40px;gap:8px;align-items:center;font-size:12px}.bar{height:9px;border-radius:9px;background:#ffffff16;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));transition:.25s}.mods{display:flex;flex-wrap:wrap;gap:7px;margin-top:15px}.mod{padding:7px 9px;border-radius:8px;background:#7cf2b122;border:1px solid #7cf2b166;color:var(--green);font-size:12px}.empty{padding:18px;text-align:center;color:var(--muted)}.message{min-height:25px;margin-top:13px;color:var(--gold);text-align:center}.filter{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap}.filter button,button{border:0;border-radius:8px;padding:9px 12px;background:linear-gradient(#a8eaff,#51bfff);font-weight:bold;cursor:pointer;color:#061018}.filter button{background:#ffffff12;color:var(--text);border:1px solid #ffffff20}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:15px}.stat{padding:10px;text-align:center;border:1px solid #ffffff16;border-radius:9px;background:#ffffff08}.stat small{color:var(--muted);display:block}.stat b{color:var(--gold);display:block;margin-top:4px;font-size:19px}@media(max-width:760px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><main class="app"><header class="top"><div><h1>PROJECT DELTA：武器改装台</h1><p>安装配件，提升武器属性，打造你的专属枪械</p></div><div><a href="project-delta-rng.html">返回 RNG 市场</a> <a href="index.html">射击游戏</a></div></header>
<section class="stats"><div class="stat"><small>当前武器</small><b id="weaponName">AK-12</b></div><div class="stat"><small>已安装配件</small><b id="modCount">0/5</b></div><div class="stat"><small>改装等级</small><b id="level">1</b></div><div class="stat"><small>武器评分</small><b id="rating">100</b></div></section>
<div class="layout"><section class="panel"><h2>选择武器</h2><div class="guns" id="guns"></div></section><section class="panel"><div class="weapon"><h3 id="title">AK-12</h3><p id="description">全能型突击步枪</p><div class="bars" id="bars"></div><div class="mods" id="mods"><span class="empty">暂未安装配件</span></div></div><h2 style="margin-top:18px">配件仓库</h2><div class="filter"><button data-filter="all">全部</button><button data-filter="scope">瞄准镜</button><button data-filter="barrel">枪口</button><button data-filter="grip">握把</button><button data-filter="magazine">弹匣</button></div><div class="parts" id="parts"></div><div class="message" id="message">选择武器后，点击配件进行安装或卸下。</div></section></div>
<script>
const weaponDefs=[['AK-12','全能型突击步枪',68,52,58,45,50],['M4A1','稳定型突击步枪',62,64,61,57,54],['SCAR-H','高伤害战斗步枪',82,38,48,35,42],['MP5','近距离冲锋枪',42,86,72,70,61],['M870','泵动霰弹枪',94,25,28,40,35],['SVD','半自动狙击枪',88,31,30,82,34],['AWM','栓动狙击枪',100,18,20,96,29]];
const partDefs=[['红点瞄准镜','scope',{accuracy:8,handling:5},'提升近中距离精准度'],['全息瞄准镜','scope',{accuracy:10,handling:3},'提升瞄准速度'],['4倍战斗瞄准镜','scope',{accuracy:18,handling:-4,range:12},'提升精准度与射程'],['6倍狙击镜','scope',{accuracy:25,handling:-10,range:20},'大幅提升远距离属性'],['热成像瞄准镜','scope',{accuracy:16,range:15},'特殊环境下更容易发现目标'],['消音器','barrel',{handling:2,accuracy:4,range:-3},'降低噪音并略微提升精准度'],['制退器','barrel',{accuracy:7,recoil:12},'减少后坐力'],['补偿器','barrel',{recoil:15,handling:-2},'显著控制水平后坐力'],['重型枪管','barrel',{damage:8,range:12,handling:-7},'增加伤害和射程'],['垂直握把','grip',{recoil:10,handling:5},'提升稳定性'],['斜角握把','grip',{accuracy:5,handling:9,recoil:4},'平衡控制和操控'],['轻量握把','grip',{handling:14,recoil:-3},'大幅提升操控速度'],['扩容弹匣','magazine',{capacity:15,handling:-5},'增加弹匣容量'],['快速弹匣','magazine',{handling:12,capacity:5},'提高换弹速度'],['精密弹匣','magazine',{accuracy:5,capacity:8},'提升弹道稳定性']];
let selected=0,filter='all',installed=[];const $=id=>document.getElementById(id);const statNames=[['damage','伤害'],['accuracy','精准'],['handling','操控'],['range','射程'],['recoil','稳定']];
function current(){return weaponDefs[selected]}
function renderGuns(){$('guns').innerHTML=weaponDefs.map((w,i)=>`<div class="choice ${i===selected?'active':''}" data-gun="${i}"><b>${w[0]}</b><small>${w[1]}</small></div>`).join('');document.querySelectorAll('[data-gun]').forEach(e=>e.onclick=()=>{selected=+e.dataset.gun;installed=[];renderAll();msg('已切换到 '+current()[0])})}
function stats(){let w=current();let s={damage:w[2],accuracy:w[3],handling:w[4],range:w[5],recoil:w[6],capacity:30};installed.forEach(p=>Object.entries(p.mods).forEach(([k,v])=>s[k]=(s[k]||0)+v));return s}
function renderWeapon(){let w=current(),s=stats();$('weaponName').textContent=w[0];$('title').textContent=w[0];$('description').textContent=w[1];$('bars').innerHTML=statNames.map(([key,label])=>`<div class="barrow"><span>${label}</span><div class="bar"><div class="fill" style="width:${Math.min(100,Math.max(2,s[key]))}%"></div></div><b>${Math.round(s[key])}</b></div>`).join('');$('mods').innerHTML=installed.length?installed.map(p=>`<span class="mod">${p.name} ×</span>`).join(''):'<span class="empty">暂未安装配件</span>';$('modCount').textContent=installed.length+'/5';$('level').textContent=Math.min(5,1+Math.floor(installed.length/2));$('rating').textContent=Math.round(s.damage+s.accuracy+s.handling+s.range+s.recoil)}
function renderParts(){let list=filter==='all'?partDefs:partDefs.filter(p=>p[1]===filter);$('parts').innerHTML=list.map((p,i)=>{let realIndex=partDefs.indexOf(p),has=installed.some(x=>x.name===p[0]);return `<div class="choice ${has?'active':''}" data-part="${realIndex}"><b>${p[0]} ${has?'✓':''}</b><small>${p[3]} · ${Object.entries(p[2]).map(([k,v])=>k+' '+(v>0?'+':'')+v).join('，')}</small></div>`}).join('');document.querySelectorAll('[data-part]').forEach(e=>e.onclick=()=>togglePart(+e.dataset.part))}
function togglePart(i){let p=partDefs[i],found=installed.findIndex(x=>x.name===p[0]);if(found>=0){installed.splice(found,1);msg('已卸下 '+p[0])}else{if(installed.length>=5){msg('配件槽已满，最多安装 5 个配件。');return}installed.push({name:p[0],mods:p[2]});msg('已安装 '+p[0]+'，武器属性已提升。')}renderAll()}
function msg(text){$('message').textContent=text}
function renderAll(){renderGuns();renderWeapon();renderParts()}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderParts()});renderAll();
</script></main></body></html>
