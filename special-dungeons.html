<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Delta：特殊副本</title>
<style>
:root{--bg:#071018;--panel:#0d1d29;--line:#35627c;--text:#edf7ff;--muted:#9eb9c8;--blue:#79d8ff;--green:#7cf2b1;--gold:#ffd568;--red:#ff7979;--purple:#cfbaff}*{box-sizing:border-box}body{margin:0;padding:18px;background:radial-gradient(circle at top,#20495b,#071018 50%,#03070b);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif}.app{width:min(1100px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.top h1{margin:0;color:var(--green);letter-spacing:2px;font-size:clamp(25px,4vw,42px)}.top p{margin:6px 0;color:var(--muted)}a{color:var(--blue);border:1px solid #79d8ff66;border-radius:9px;padding:9px 12px;text-decoration:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{padding:12px;text-align:center;border:1px solid #ffffff18;border-radius:10px;background:#ffffff09}.stat small{display:block;color:var(--muted)}.stat b{display:block;color:var(--gold);font-size:21px;margin-top:5px}.notice{padding:14px;border:1px solid #79d8ff55;border-radius:12px;background:#102d3aaa;color:#d8edf7;line-height:1.6;margin-bottom:15px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:15px}.panel{padding:16px;border:1px solid var(--line);border-radius:15px;background:rgba(13,29,41,.9)}h2{margin:0 0 12px;color:var(--blue);font-size:20px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.card{padding:12px;border:1px solid #58798b;border-radius:11px;background:linear-gradient(145deg,#153746,#0b1923);cursor:pointer;min-height:145px}.card:hover,.card.selected{border-color:var(--green);box-shadow:0 0 0 2px #7cf2b122}.card.locked{opacity:.75}.card h3{margin:0;color:var(--gold);font-size:15px}.card p{color:var(--muted);font-size:12px;line-height:1.5;margin:8px 0}.key{color:var(--purple);font-size:12px}.keys{display:grid;gap:8px;margin-bottom:13px}.keyrow{display:flex;align-items:center;justify-content:space-between;padding:10px;border:1px solid #ffffff14;border-radius:9px;background:#ffffff08}.keyrow button,.enter{border:0;border-radius:8px;padding:8px 11px;background:linear-gradient(#a8eaff,#51bfff);font-weight:bold;cursor:pointer;color:#061018}.keyrow button:disabled,.enter:disabled{opacity:.4;cursor:not-allowed}.selected{border-color:var(--green)!important}.result{margin-top:13px;min-height:58px;padding:12px;border-radius:10px;text-align:center;background:#0005;color:var(--gold);line-height:1.5}.good{color:var(--green)}.bad{color:var(--red)}.loot{display:grid;gap:7px;max-height:260px;overflow:auto}.lootitem{padding:9px;border:1px solid #ffffff16;border-radius:8px;background:#ffffff08}.lootitem b{display:block}.lootitem small{color:var(--muted)}.legendary{color:var(--gold)}.epic{color:var(--purple)}.rare{color:var(--blue)}.uncommon{color:var(--green)}@media(max-width:720px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><main class="app">
<header class="top"><div><h1>PROJECT DELTA：特殊副本</h1><p>使用 Key Card 打开特殊区域，获取高价值战利品</p></div><div><a href="project-delta-rng.html">返回 RNG 市场</a> <a href="index.html">射击游戏</a></div></header>
<section class="stats"><div class="stat"><small>现金</small><b id="cash">25000</b></div><div class="stat"><small>已完成副本</small><b id="completed">0/6</b></div><div class="stat"><small>钥匙卡</small><b id="keyCount">0</b></div><div class="stat"><small>战利品价值</small><b id="value">0</b></div></section>
<div class="notice">特殊副本需要对应的 Key Card。先选择一张钥匙卡，再选择一个副本进入。成功进入后会消耗钥匙卡，并随机获得高等级枪械、配件或稀有物资。</div>
<div class="layout"><section class="panel"><h2>Key Card 仓库</h2><div class="keys" id="keys"></div><h2>特殊副本</h2><div class="cards" id="dungeons"></div><div class="result" id="result">选择 Key Card 和特殊副本。</div></section><section class="panel"><h2>副本战利品</h2><div class="loot" id="loot"><div style="color:var(--muted);text-align:center;padding:20px">还没有战利品。</div></div></section></div>
<script>
const keyDefs=[['蓝色 Key Card','blue','蓝色实验室副本',3],['红色 Key Card','red','红色军械库副本',2],['黑色 Key Card','black','黑匣子副本',1],['金色 Key Card','gold','指挥中心副本',1],['紫色 Key Card','purple','量子研究所副本',1],['撤离 Key Card','extract','秘密撤离副本',2]];
const dungeonDefs=[['蓝色实验室','blue','生物样本与高级医疗物资',7000],['红色军械库','red','高阶武器与枪械配件',9500],['黑匣子基地','black','情报文件与传奇电子物品',12000],['指挥中心','gold','传奇装备与稀有钥匙卡',18000],['量子研究所','purple','实验材料与史诗配件',24000],['秘密撤离点','extract','撤离凭证与终极战利品',30000]];
const lootNames=['高级医疗包','军用电池','加密硬盘','黄金条','黑匣子','武器蓝图','战区通行证','量子芯片','稀有合金','指挥官印章','钻石碎片','金色雕像','AWM 狙击枪','HK416 突击步枪','热成像瞄准镜','8倍狙击镜','高级装甲板','密码破解器','卫星模块','撤离凭证'];
let keyInventory={blue:3,red:2,black:1,gold:1,purple:1,extract:2};let selectedKey=null,selectedDungeon=null,completed=0,cash=25000,totalValue=0,loot=[];
const $=id=>document.getElementById(id);const rarity=()=>{let r=Math.random();return r<.08?'legendary':r<.32?'epic':r<.7?'rare':'uncommon'};
function renderKeys(){$('keys').innerHTML=keyDefs.map(k=>`<div class="keyrow ${selectedKey===k[1]?'selected':''}"><div><b class="key">${k[0]}</b><small style="display:block;color:var(--muted)">${k[2]} · 拥有 ${keyInventory[k[1]]}</small></div><button ${keyInventory[k[1]]<=0?'disabled':''} data-key="${k[1]}">选择</button></div>`).join('');document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{selectedKey=b.dataset.key;message('已选择 '+keyDefs.find(x=>x[1]===selectedKey)[0],'');renderKeys();renderDungeons()})}
function renderDungeons(){$('dungeons').innerHTML=dungeonDefs.map((d,i)=>`<div class="card ${selectedDungeon===i?'selected':''}"><h3>${d[0]}</h3><p>${d[2]}<br>预计价值：$${d[3].toLocaleString()}</p><span class="key">需要：${keyDefs.find(k=>k[1]===d[1])[0]}</span><br><button class="enter" data-dungeon="${i}" ${selectedKey!==d[1]||keyInventory[d[1]]<=0||completed>=6?'disabled':''}>进入副本</button></div>`).join('');document.querySelectorAll('[data-dungeon]').forEach(b=>b.onclick=()=>enterDungeon(+b.dataset.dungeon))}
function renderLoot(){$('loot').innerHTML=loot.length?loot.map(x=>`<div class="lootitem"><b class="${x.rarity}">${x.name}</b><small>${x.rarity} · 价值 $${x.value.toLocaleString()}</small></div>`).join(''):'<div style="color:var(--muted);text-align:center;padding:20px">还没有战利品。</div>'}
function refresh(){$('cash').textContent=cash.toLocaleString();$('completed').textContent=completed+'/6';$('keyCount').textContent=Object.values(keyInventory).reduce((a,b)=>a+b,0);$('value').textContent=totalValue.toLocaleString()}
function message(t,c){$('result').textContent=t;$('result').className='result '+c}
function enterDungeon(i){let d=dungeonDefs[i];if(selectedKey!==d[1])return message('钥匙卡不匹配：需要 '+keyDefs.find(k=>k[1]===d[1])[0],'bad');if(keyInventory[d[1]]<=0)return message('这张钥匙卡已经用完。','bad');keyInventory[d[1]]--;completed++;let count=2+Math.floor(Math.random()*3);let found=[];for(let n=0;n<count;n++){let name=lootNames[Math.floor(Math.random()*lootNames.length)],r=rarity(),v=Math.floor((d[3]/count)*(r==='legendary'?2.2:r==='epic'?1.5:r==='rare'?1:.65));found.push({name,rarity:r,value:v});cash+=v;totalValue+=v;loot.unshift(found[found.length-1])}message('进入 '+d[0]+' 成功！消耗 1 张钥匙卡，获得 '+count+' 件战利品。','good');selectedKey=null;renderKeys();renderDungeons();renderLoot();refresh()}
renderKeys();renderDungeons();renderLoot();refresh();
</script></main></body></html>
