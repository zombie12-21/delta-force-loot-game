<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Delta：Keychain</title>
<style>
:root{--bg:#071018;--panel:#0d1d29;--line:#35627c;--text:#edf7ff;--muted:#9eb9c8;--blue:#79d8ff;--green:#7cf2b1;--gold:#ffd568;--purple:#cfbaff;--red:#ff7979}*{box-sizing:border-box}body{margin:0;padding:18px;background:radial-gradient(circle at top,#20495b,#071018 50%,#03070b);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif}.app{width:min(1100px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.top h1{margin:0;color:var(--green);letter-spacing:2px;font-size:clamp(25px,4vw,42px)}.top p{margin:6px 0;color:var(--muted)}a{color:var(--blue);border:1px solid #79d8ff66;border-radius:9px;padding:9px 12px;text-decoration:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{padding:12px;text-align:center;border:1px solid #ffffff18;border-radius:10px;background:#ffffff09}.stat small{display:block;color:var(--muted)}.stat b{display:block;color:var(--gold);font-size:21px;margin-top:5px}.notice,.panel{border:1px solid var(--line);border-radius:15px;background:rgba(13,29,41,.9);padding:16px}.notice{margin-bottom:15px;color:#d8edf7;line-height:1.65}.layout{display:grid;grid-template-columns:1fr 1fr;gap:15px}h2{margin:0 0 13px;color:var(--blue);font-size:20px}.keychain{position:relative;padding:20px;text-align:center;border:1px solid #ffd56877;border-radius:15px;background:linear-gradient(145deg,#3b341d,#101b22);margin-bottom:15px}.ring{width:86px;height:86px;margin:5px auto 14px;border:12px solid #b8c7d0;border-right-color:#64717b;border-radius:50%;box-shadow:0 0 0 4px #ffd56822,0 8px 25px #0008}.keychain strong{display:block;color:var(--gold);font-size:20px}.keychain span{display:block;color:var(--muted);font-size:12px;margin-top:5px}.keys{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.key{padding:11px;border:1px solid #ffffff1c;border-radius:10px;background:#ffffff08}.key.active{border-color:var(--green);box-shadow:0 0 0 2px #7cf2b122}.key h3{margin:0 0 5px;font-size:14px}.key p{margin:0;color:var(--muted);font-size:11px;line-height:1.5}.key button,.unlock{margin-top:8px;border:0;border-radius:7px;padding:7px 10px;background:linear-gradient(#a8eaff,#51bfff);font-weight:bold;cursor:pointer;color:#061018}.key button:disabled,.unlock:disabled{opacity:.4;cursor:not-allowed}.dungeons{display:grid;gap:9px}.dungeon{padding:12px;border:1px solid #ffffff18;border-radius:10px;background:#ffffff08}.dungeon h3{margin:0;color:var(--gold);font-size:15px}.dungeon p{margin:5px 0;color:var(--muted);font-size:12px}.unlock{float:right;margin-top:-34px}.result{clear:both;min-height:45px;margin-top:14px;padding:12px;text-align:center;border-radius:9px;background:#0005;color:var(--gold);line-height:1.5}.good{color:var(--green)}.bad{color:var(--red)}@media(max-width:700px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.keys{grid-template-columns:1fr}}
</style>
</head>
<body><main class="app">
<header class="top"><div><h1>PROJECT DELTA：KEYCHAIN</h1><p>12+ 张 Key Card · 一个战术钥匙链 · 特殊副本解锁</p></div><div><a href="special-dungeons.html">返回特殊副本</a> <a href="project-delta-rng.html">RNG 市场</a></div></header>
<section class="stats"><div class="stat"><small>钥匙总数</small><b id="total">0</b></div><div class="stat"><small>钥匙链槽位</small><b>12</b></div><div class="stat"><small>已解锁副本</small><b id="unlocked">0</b></div><div class="stat"><small>消耗钥匙</small><b id="used">0</b></div></section>
<div class="notice">你拥有一个专属 Keychain，可以收纳 12 张不同的特殊钥匙卡。选择钥匙卡后，用它开启对应的特殊副本；每次进入副本会消耗一张钥匙卡。</div>
<div class="layout"><section class="panel"><h2>我的 Keychain</h2><div class="keychain"><div class="ring"></div><strong>TACTICAL KEYCHAIN</strong><span>一个钥匙链 · 12 个卡槽 · 项目 Delta</span></div><div class="keys" id="keys"></div></section><section class="panel"><h2>特殊副本入口</h2><div class="dungeons" id="dungeons"></div><div class="result" id="result">选择一张 Key Card，然后进入匹配的副本。</div></section></div>
<script>
const keyDefs=[
 ['蓝色 Key Card','blue','蓝色实验室','生物实验室'],['红色 Key Card','red','红色军械库','高级武器库'],['黑色 Key Card','black','黑匣子基地','机密情报室'],['金色 Key Card','gold','指挥中心','指挥官保险库'],
 ['紫色 Key Card','purple','量子研究所','量子实验室'],['撤离 Key Card','extract','秘密撤离点','隐藏撤离区'],['绿色 Key Card','green','森林仓库','野战补给库'],['白色 Key Card','white','雪地观测站','极地情报室'],
 ['橙色 Key Card','orange','沙漠雷达站','雷达控制室'],['银色 Key Card','silver','海岸数据中心','服务器机房'],['铂金 Key Card','platinum','地下金库','贵重物资库'],['彩虹 Key Card','rainbow','Project Delta 核心区','终极战利品室']
];
const dungeons=keyDefs.map((x,i)=>({name:x[2],key:x[1],room:x[3],reward:7000+i*1800}));
let keys=Object.fromEntries(keyDefs.map(x=>[x[1],1])),selected=null,used=0,unlocked=0;
const $=id=>document.getElementById(id);
function renderKeys(){$('keys').innerHTML=keyDefs.map(k=>`<div class="key ${selected===k[1]?'active':''}"><h3 style="color:${k[1]==='rainbow'?'#ffb7ec':k[1]==='gold'?'#ffd568':'#79d8ff'}">${k[0]}</h3><p>${k[3]}<br>拥有：${keys[k[1]]} 张</p><button data-key="${k[1]}" ${keys[k[1]]<=0?'disabled':''}>${selected===k[1]?'已选择':'装备到钥匙链'}</button></div>`).join('');document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{selected=b.dataset.key;renderKeys();renderDungeons();msg('已装备 '+keyDefs.find(x=>x[1]===selected)[0],'')})}
function renderDungeons(){$('dungeons').innerHTML=dungeons.map(d=>`<div class="dungeon"><h3>${d.name}</h3><p>${d.room}<br>预计战利品价值：$${d.reward.toLocaleString()}<br>需要：${keyDefs.find(x=>x[1]===d.key)[0]}</p><button class="unlock" data-dungeon="${d.key}" ${selected!==d.key||keys[d.key]<=0?'disabled':''}>进入副本</button></div>`).join('');document.querySelectorAll('[data-dungeon]').forEach(b=>b.onclick=()=>enter(b.dataset.dungeon))}
function refresh(){$('total').textContent=Object.values(keys).reduce((a,b)=>a+b,0);$('unlocked').textContent=unlocked;$('used').textContent=used}
function msg(text,kind){$('result').textContent=text;$('result').className='result '+kind}
function enter(type){if(!selected||selected!==type)return msg('钥匙卡不匹配，请装备正确的 Key Card。','bad');if(keys[type]<=0)return msg('该钥匙卡已经用完。','bad');keys[type]--;used++;unlocked++;selected=null;msg('副本开启成功！已消耗 1 张钥匙卡。进入后可获得高价值战利品。','good');renderKeys();renderDungeons();refresh()}
renderKeys();renderDungeons();refresh();
</script></main></body></html>
