<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Delta：15箱 RNG 市场</title>
<style>
:root{--bg:#071018;--panel:#0d1b26;--panel2:#112635;--line:#315b72;--text:#edf7ff;--muted:#9db8c7;--blue:#78d8ff;--green:#7cf3b1;--gold:#ffd568;--red:#ff7c7c;--purple:#cfb9ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1e475a,#071018 48%,#03070b);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif;padding:16px}.app{max-width:1250px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.top h1{margin:0;color:var(--green);font-size:clamp(25px,4vw,44px);letter-spacing:2px}.top p{margin:5px 0;color:var(--muted)}a{color:var(--blue);text-decoration:none;border:1px solid #78d8ff66;border-radius:9px;padding:9px 12px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0}.stat{background:#ffffff09;border:1px solid #ffffff18;border-radius:11px;padding:10px;text-align:center}.stat small{color:var(--muted)}.stat b{display:block;color:var(--gold);font-size:21px;margin-top:4px}.layout{display:grid;grid-template-columns:1.3fr .7fr;gap:15px}.panel{background:rgba(13,27,38,.9);border:1px solid var(--line);border-radius:16px;padding:16px}.panel h2{margin:0 0 12px;color:var(--blue);font-size:20px}.crates{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.crate{min-height:104px;cursor:pointer;border:1px solid #557c8f;border-radius:11px;background:linear-gradient(145deg,#153747,#0b1a24);padding:10px;transition:.15s;position:relative}.crate:hover,.crate.selected{border-color:var(--green);transform:translateY(-2px);box-shadow:0 0 0 2px #7cf3b122}.crate strong{display:block;font-size:12px}.crate span{display:block;color:var(--gold);font-size:11px;margin-top:7px}.crate em{font-style:normal;color:var(--purple);font-size:10px}.open-area{text-align:center;border:1px dashed #78d8ff55;border-radius:13px;padding:20px;margin-top:14px;background:#ffffff06}.open-area .box{font-size:58px;line-height:1;margin:6px}.open-area .selected-name{color:var(--gold);font-weight:bold}.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:9px;padding:12px 16px;background:linear-gradient(#a9edff,#55bfff);font-weight:800;cursor:pointer;color:#06121a}button.secondary{background:#ffffff12;color:var(--text);border:1px solid #ffffff25}button:disabled{opacity:.45;cursor:not-allowed}.result{min-height:56px;margin-top:15px;border-radius:10px;padding:12px;text-align:center;color:var(--gold);background:#0005}.inventory{max-height:510px;overflow:auto;display:grid;gap:7px}.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px;border-radius:9px;background:#ffffff08;border:1px solid #ffffff12;font-size:12px}.item .name{font-weight:bold}.item .meta{color:var(--muted)}.item button{padding:6px 9px;font-size:11px}.empty{color:var(--muted);padding:20px;text-align:center}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.filters button{padding:7px 9px;font-size:11px}.catalog{margin-top:15px}.catalog-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:220px;overflow:auto}.catalog-item{padding:7px;background:#ffffff06;border:1px solid #ffffff0e;border-radius:7px;font-size:11px}.catalog-item b{display:block}.catalog-item small{color:var(--muted)}.common{color:#c8d5dc}.uncommon{color:#73e3a4}.rare{color:#77cfff}.epic{color:#cfb9ff}.legendary{color:#ffd568}.message-good{color:var(--green)}.message-bad{color:var(--red)}@media(max-width:900px){.layout{grid-template-columns:1fr}.crates{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:520px){.crates{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.catalog-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><main class="app">
<header class="top"><div><h1>PROJECT DELTA：RNG 市场</h1><p>15 个战利品箱 · 100+ 可出售物品 · 22 把枪 · 44 件配件</p></div><a href="index.html">返回射击游戏</a></header>
<section class="stats"><div class="stat"><small>现金</small><b id="cash">10000</b></div><div class="stat"><small>箱子</small><b id="crates">15</b></div><div class="stat"><small>已开箱</small><b id="opened">0</b></div><div class="stat"><small>库存</small><b id="inventoryCount">0</b></div><div class="stat"><small>总价值</small><b id="value">0</b></div></section>
<div class="layout"><section class="panel"><h2>选择战利品箱</h2><div class="crates" id="cratesGrid"></div><div class="open-area"><div class="box">📦</div><div>当前箱：<span class="selected-name" id="selectedName">新手补给箱</span></div><div class="controls"><button id="openBtn">开箱</button><button class="secondary" id="openAllBtn">开完剩余箱子</button></div><div class="result" id="result">选择箱子后点击开箱，随机获得武器、配件或物品。</div></div><div class="catalog"><h2>物品图鉴：<span id="catalogCount">0</span> 件</h2><div class="filters"><button class="secondary filter" data-filter="all">全部</button><button class="secondary filter" data-filter="gun">枪械</button><button class="secondary filter" data-filter="accessory">配件</button><button class="secondary filter" data-filter="loot">物资</button></div><div class="catalog-grid" id="catalog"></div></div></section>
<section class="panel"><h2>库存与出售</h2><div class="inventory" id="inventory"><div class="empty">库存为空，打开箱子获得物品。</div></div></section></div>
</main>
<script>
const guns=[
'AK-12','M4A1','SCAR-H','G36','MP5','UMP45','Vector','P90','PP-19','M870','SPAS-12','SVD','M24','AWM','FAL','AUG','HK416','QBZ-95','M249','PKM','Desert Eagle','Glock 17'
];
const accessories=[
'红点瞄准镜','全息瞄准镜','4倍战斗瞄准镜','6倍狙击镜','8倍狙击镜','热成像瞄准镜','消音器','制退器','补偿器','消焰器','垂直握把','斜角握把','轻量握把','重型握把','战术枪托','精密枪托','扩容弹匣','快速弹匣','双排弹匣','狙击弹匣','激光指示器','战术手电','枪带','枪口转接环','碳纤维枪管','重型枪管','精密枪管','短枪管','战术护木','轻型护木','重型护木','防滑手套','弹药袋','医疗腰包','侦察耳机','战术耳机','夜视仪','无人机电池','装甲板','高级装甲板','密码破解器','信号增强器','地图芯片','战术指南针'
];
const lootNames=['绷带','止痛药','医疗包','高级医疗包','5.56毫米弹药','7.62毫米弹药','9毫米弹药','12号霰弹','狙击弹药','燃料罐','电池','军用电池','铜线圈','电子芯片','加密硬盘','旧手机','军用无线电','卫星模块','战术地图','情报文件','保险丝','机械零件','光学镜片','合金片','碳纤维','钛合金','稀土样本','蓝色钥匙卡','红色钥匙卡','黑色钥匙卡','门禁卡','现金包','金币箱','实验室样本','无人机零件','引擎零件','装甲碎片','弹簧组件','轴承','工具箱','维修工具','电路板','处理器','硬盘','数据棒','水过滤器','净水片','口粮','咖啡包','能量饮料','防毒面具','护目镜','防弹头盔','轻型背心','重型背心','侦察背心','战术背包','大型背包','无线电天线','发电机零件','信号旗','任务徽章','旧照片','银制徽章','金色雕像','古董手表','钻石碎片','红宝石','蓝宝石','翡翠','稀有药剂','实验试剂','冷藏样本','生物容器','化学滤芯','磁盘阵列','服务器模块','微型摄像头','光纤线缆','军用望远镜','望远镜镜片','密码本','行动日志','指挥官印章','黑匣子','卫星电话','应急信标','高能电池','量子芯片','合成材料','稀有合金','收藏硬币','古代地图','艺术品碎片','加密钱包','数据密钥','黄金条','战区通行证','撤离凭证','补给合同','黑市代币','训练手册','武器蓝图','改装图纸','无人机蓝图','载具钥匙'];
const crateDefs=[['新手补给箱',300,0.62],['弹药箱',500,0.58],['医疗箱',700,0.54],['军械箱',1000,0.48],['侦察箱',1300,0.43],['战术箱',1600,0.39],['稀有物资箱',2200,0.33],['精英箱',3000,0.28],['狙击手箱',3800,0.25],['黑市箱',5000,0.21],['机密箱',6500,0.17],['传奇箱',8500,0.13],['指挥箱',11000,0.1],['黄金行动箱',15000,0.07],['Project Delta 终极箱',25000,0.035]];
let cash=10000,opened=0,inventory=[],selected=0,catalogFilter='all';
const $=x=>document.getElementById(x);const rarity=['common','uncommon','rare','epic','legendary'];
function price(i){return Math.floor(60+Math.random()*1200*(1+i/12));}
function makeCatalog(){return [...guns.map((x,i)=>({name:x,type:'gun',price:price(i),rarity:i>17?'epic':i>10?'rare':'uncommon'})),...accessories.map((x,i)=>({name:x,type:'accessory',price:price(i),rarity:i>36?'legendary':i>24?'epic':i>10?'rare':'uncommon'})),...lootNames.map((x,i)=>({name:x,type:'loot',price:price(i),rarity:i>90?'legendary':i>65?'epic':i>35?'rare':i>10?'uncommon':'common'}))]}
const catalogData=makeCatalog();
function randomItem(){let r=Math.random(),pool;if(r<.17)pool=catalogData.filter(x=>x.type==='gun');else if(r<.43)pool=catalogData.filter(x=>x.type==='accessory');else pool=catalogData.filter(x=>x.type==='loot');let item={...pool[Math.floor(Math.random()*pool.length)]};if(Math.random()<.07)item.rarity='legendary';item.price=Math.floor(item.price*(item.rarity==='legendary'?2.4:item.rarity==='epic'?1.7:1));return item}
function renderCrates(){ $('cratesGrid').innerHTML=crateDefs.map((c,i)=>`<div class="crate ${i===selected?'selected':''}" data-i="${i}"><strong>${c[0]}</strong><span>$${c[1].toLocaleString()}</span><em>传奇率 ${(c[2]*100).toFixed(1)}%</em></div>`).join('');document.querySelectorAll('.crate').forEach(e=>e.onclick=()=>{selected=+e.dataset.i;renderCrates();$('selectedName').textContent=crateDefs[selected][0]})}
function renderStats(){$('cash').textContent=cash.toLocaleString();$('crates').textContent=Math.max(0,15-opened);$('opened').textContent=opened;$('inventoryCount').textContent=inventory.length;$('value').textContent=inventory.reduce((a,x)=>a+x.price,0).toLocaleString()}
function renderInventory(){let el=$('inventory');if(!inventory.length){el.innerHTML='<div class="empty">库存为空，打开箱子获得物品。</div>';return}el.innerHTML=inventory.map((x,i)=>`<div class="item"><div><span class="name ${x.rarity}">${x.name}</span><div class="meta">${x.type==='gun'?'枪械':x.type==='accessory'?'配件':'物资'} · ${x.rarity} · $${x.price.toLocaleString()}</div></div><button data-sell="${i}">出售</button></div>`).join('');document.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>{let i=+b.dataset.sell;cash+=inventory[i].price;inventory.splice(i,1);renderAll();$('result').textContent='已出售物品，现金增加。'})}
function renderCatalog(){let list=catalogFilter==='all'?catalogData:catalogData.filter(x=>x.type===catalogFilter);$('catalogCount').textContent=catalogData.length;$('catalog').innerHTML=list.map(x=>`<div class="catalog-item"><b class="${x.rarity}">${x.name}</b><small>${x.type==='gun'?'枪械':x.type==='accessory'?'配件':'物资'} · $${x.price.toLocaleString()}</small></div>`).join('')}
function renderAll(){renderCrates();renderStats();renderInventory();renderCatalog()}
function openCrate(){if(opened>=15){$('result').textContent='所有箱子都已开启。';return}let def=crateDefs[selected];if(cash<def[1]){$('result').innerHTML=`现金不足，需要 $${def[1].toLocaleString()}。`;$('result').className='result message-bad';return}cash-=def[1];opened++;let item=randomItem();let text=`${def[0]} 开启成功！获得：${item.name}（${item.type==='gun'?'枪械':item.type==='accessory'?'配件':'物资'}，${item.rarity}）价值 $${item.price.toLocaleString()}`;inventory.push(item);$('result').textContent=text;$('result').className='result '+(item.rarity==='legendary'?'message-good':'');if(opened>=15){$('openBtn').disabled=true;$('openAllBtn').disabled=true}renderStats();renderInventory()}
function openAll(){while(opened<15&&cash>=crateDefs[selected][1]){let def=crateDefs[selected];cash-=def[1];opened++;inventory.push(randomItem())}if(opened>=15){$('openBtn').disabled=true;$('openAllBtn').disabled=true}$('result').textContent='已快速开启可负担的剩余箱子。';renderStats();renderInventory()}
$('openBtn').onclick=openCrate;$('openAllBtn').onclick=openAll;document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{catalogFilter=b.dataset.filter;renderCatalog()});renderAll();
</script></body></html>
