<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Delta：开启战利品箱</title>
<style>
:root{--bg:#071018;--panel:#0d1b26;--panel2:#112635;--line:#315b72;--text:#edf7ff;--muted:#9db8c7;--blue:#78d8ff;--green:#7cf3b1;--gold:#ffd568;--red:#ff7c7c;--purple:#cfb9ff}*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at top,#20495b,#071018 52%,#03070b);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif}.app{width:min(1200px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.top h1{margin:0;color:var(--green);letter-spacing:2px;font-size:clamp(26px,4vw,43px)}.top p{margin:6px 0;color:var(--muted)}a{color:var(--blue);border:1px solid #79d8ff66;border-radius:9px;padding:9px 12px;text-decoration:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:16px 0}.stat{padding:10px;text-align:center;background:#ffffff09;border:1px solid #ffffff18;border-radius:10px}.stat small{display:block;color:var(--muted)}.stat b{display:block;color:var(--gold);font-size:20px;margin-top:4px}.layout{display:grid;grid-template-columns:1fr 1.1fr;gap:14px}.panel{padding:15px;border:1px solid var(--line);border-radius:15px;background:rgba(13,27,38,.94)}h2{margin:0 0 12px;color:var(--blue);font-size:20px}.crates{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-height:610px;overflow:auto}.crate{padding:11px;border:1px solid #ffffff18;border-radius:9px;background:#ffffff08;cursor:pointer}.crate:hover,.crate.selected{border-color:var(--green);background:#7cf2b116}.crate strong,.crate span{display:block}.crate span{color:var(--gold);font-size:12px;margin-top:5px}.openArea{text-align:center;padding:25px 15px}.box{font-size:90px;filter:drop-shadow(0 0 20px #79d8ff77);transition:.2s}.box.opening{animation:shake .5s infinite}@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}.selectedName{color:var(--gold);font-size:20px;margin:8px}.result{min-height:38px;margin:14px 0;padding:10px;border-radius:8px;background:#ffffff08;color:var(--muted)}button{border:0;border-radius:9px;padding:11px 15px;background:linear-gradient(#a8eaff,#51bfff);font-weight:bold;cursor:pointer;color:#061018}button.secondary{background:#ffffff12;color:var(--text);border:1px solid #ffffff25}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.inventory{display:grid;gap:7px;max-height:420px;overflow:auto}.item{display:flex;justify-content:space-between;gap:8px;padding:9px;border:1px solid #ffffff14;border-radius:8px;background:#ffffff08}.item small{display:block;color:var(--muted);margin-top:3px}.common{color:#d9e5eb}.uncommon{color:var(--green)}.rare{color:var(--blue)}.epic{color:var(--purple)}.legendary{color:var(--gold)}.empty{text-align:center;color:var(--muted);padding:20px}.notice{margin-top:12px;color:var(--muted);font-size:12px;line-height:1.6}@media(max-width:720px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><main class="app"><header class="top"><div><h1>PROJECT DELTA：战利品箱</h1><p>选择箱子 · 支付现金 · 随机开出武器、配件或物资</p></div><div><a href="index.html">返回战场</a> <a href="warehouse.html">安全仓库</a> <a href="project-delta-rng.html">完整 RNG 市场</a></div></header>
<section class="stats"><div class="stat"><small>现金</small><b id="cash">10,000</b></div><div class="stat"><small>剩余箱数</small><b id="remaining">15</b></div><div class="stat"><small>已开箱</small><b id="opened">0</b></div><div class="stat"><small>本页战利品</small><b id="count">0</b></div></section>
<div class="layout"><section class="panel"><h2>选择战利品箱</h2><div class="crates" id="crates"></div><p class="notice">每次开箱消耗一个箱子和对应现金。开启结果会放入当前库存；成功撤离或存入仓库后才算永久保存。</p></section><section class="panel"><div class="openArea"><div class="box" id="box">📦</div><div class="selectedName" id="selectedName">新手补给箱 · $300</div><div class="result" id="result">点击“开启一个箱子”开始抽取战利品。</div><div class="actions"><button id="open">开启一个箱子</button><button class="secondary" id="openAll">连续开启</button></div></div><h2>本次战利品</h2><div class="inventory" id="inventory"><div class="empty">还没有获得物品。</div></div></section></div></main>
<script>
const defs=[['新手补给箱',300,.62],['弹药箱',500,.58],['医疗箱',700,.54],['军械箱',1000,.48],['侦察箱',1300,.43],['战术箱',1600,.39],['稀有物资箱',2200,.33],['精英武器箱',2800,.27],['特种作战箱',3600,.22],['紫色装备箱',4800,.17],['高级军械箱',6200,.13],['Boss 战利品箱',8000,.1],['黑区精英箱',10000,.075],['传奇物资箱',14000,.05],['Project Delta 核心箱',20000,.025]];
const guns=['AK-12','M4A1','SCAR-H','G36','MP5','UMP45','Vector','P90','M870','SPAS-12','SVD','M24','AWM','FAL','AUG','HK416','M249','PKM'];
const accessories=['红点瞄准镜','全息瞄准镜','4倍战斗瞄准镜','6倍狙击镜','8倍狙击镜','热成像瞄准镜','消音器','制退器','补偿器','消焰器','垂直握把','斜角握把','轻量握把','扩容弹匣','快速弹匣'];
const supplies=['绷带','止痛药','医疗包','高级医疗包','5.56毫米弹药','7.62毫米弹药','9毫米弹药','狙击弹药','军用电池','装甲板','加密硬盘','撤离凭证'];
let cash=Number(localStorage.getItem('projectDeltaCash')||10000),opened=Number(sessionStorage.getItem('projectDeltaCratesOpened')||0),selected=0,inventory=JSON.parse(sessionStorage.getItem('projectDeltaCrateLoot')||'[]');
const $=id=>document.getElementById(id);let busy=false;
function rarity(i){return i>14?'legendary':i>9?'epic':i>5?'rare':i>2?'uncommon':'common'}
function item(){let roll=Math.random(),type=roll<.2?'gun':roll<.47?'accessory':'supply',name=type==='gun'?guns[Math.floor(Math.random()*guns.length)]:type==='accessory'?accessories[Math.floor(Math.random()*accessories.length)]:supplies[Math.floor(Math.random()*supplies.length)];let index=Math.floor(Math.random()*18);return{name,type,rarity:rarity(index),value:Math.floor(100+Math.random()*7000)}}
function renderCrates(){$('crates').innerHTML=defs.map((d,i)=>`<div class="crate ${i===selected?'selected':''}" data-i="${i}"><strong>${d[0]}</strong><span>$${d[1].toLocaleString()} · 稀有率 ${(d[2]*100).toFixed(1)}%</span></div>`).join('');document.querySelectorAll('[data-i]').forEach(e=>e.onclick=()=>{selected=+e.dataset.i;$('selectedName').textContent=defs[selected][0]+' · $'+defs[selected][1].toLocaleString();renderCrates()})}
function render(){ $('cash').textContent=cash.toLocaleString();$('remaining').textContent=Math.max(0,15-opened);$('opened').textContent=opened;$('count').textContent=inventory.length;$('inventory').innerHTML=inventory.length?inventory.map(x=>`<div class="item ${x.rarity}"><div><b>${x.name}</b><small>${x.type} · ${x.rarity}</small></div><span>$${x.value.toLocaleString()}</span></div>`).join(''):'<div class="empty">还没有获得物品。</div>';renderCrates()}
function save(){localStorage.setItem('projectDeltaCash',String(cash));sessionStorage.setItem('projectDeltaCratesOpened',String(opened));sessionStorage.setItem('projectDeltaCrateLoot',JSON.stringify(inventory))}
function openOne(){if(busy)return;if(opened>=15){$('result').textContent='本次行动的 15 个箱子都已开启。';return}let d=defs[selected];if(cash<d[1]){$('result').textContent='现金不足，需要 $'+d[1].toLocaleString()+'。';return}busy=true;cash-=d[1];opened++;$('box').classList.add('opening');$('result').textContent='正在搜索箱内物资……';render();setTimeout(()=>{let x=item();inventory.unshift(x);$('box').classList.remove('opening');$('result').innerHTML=`获得：<strong class="${x.rarity}">${x.name}</strong> · ${x.rarity} · $${x.value.toLocaleString()}`;save();render();busy=false},650)}
function openAll(){if(busy)return;let d=defs[selected],n=0;while(opened<15&&cash>=d[1]){cash-=d[1];opened++;inventory.unshift(item());n++}save();render();$('result').textContent=n?'连续开启 '+n+' 个箱子，物品已加入库存。':'没有足够现金或箱子。'}
$('open').onclick=openOne;$('openAll').onclick=openAll;render();
</script></body></html>
